<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8e4ff"><title>Crypto Miner Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#e8e4ff;--ink:#15122b;--y:#ffd23f;--p:#ff5d8f;--m:#2ee59d;--b:#4d7cff;--heat:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{margin:0;background:#cdc7f4;font:700 14px Manrope,sans-serif;color:var(--ink);display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;background:var(--bg) radial-gradient(rgba(21,18,43,.13) 1.3px,transparent 1.5px) 0 0/22px 22px;overflow:hidden}
.disp{font-family:Unbounded,sans-serif;font-weight:900}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:12px;position:relative}
.btn{font:800 13px Unbounded,sans-serif;border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--y);box-shadow:0 3px 0 var(--ink);color:var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:none}.btn:disabled{opacity:.4;cursor:not-allowed}
.g{background:var(--m)}.r{background:var(--p);color:#fff}.w{background:#fff}.b{background:var(--b);color:#fff}.sm{padding:7px 10px;font-size:11px}.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.sp{justify-content:space-between}
input,select{font:800 14px Unbounded,sans-serif;border:2.5px solid var(--ink);border-radius:12px;padding:9px;width:100%;min-width:0;background:#fff;color:var(--ink)}
.chip{border:2px solid var(--ink);border-radius:99px;padding:3px 9px;font-size:11px;background:#fff;white-space:nowrap}
.muted{opacity:.65;font-size:12px}

/* HUD & EXP */
#top{padding:calc(10px + env(safe-area-inset-top)) 12px 6px;display:flex;flex-direction:column;gap:6px}
#tick{overflow:hidden;border:2.5px solid var(--ink);border-radius:99px;background:var(--y);padding:4px 0;min-height:26px}
#tick>div{display:flex;width:max-content;animation:mq 24s linear infinite;gap:26px;font-size:12px}
@keyframes mq{from{transform:translateX(-50%)}to{transform:none}}
#balbox{display:flex;justify-content:space-between;align-items:center}
.bal{font-size:28px;line-height:1}
.bal small{font-size:14px;color:#0a9f6a}
.lvl-box{display:flex;align-items:center;gap:6px;width:100%}
.lvl-badge{background:var(--ink);color:var(--y);padding:2px 8px;border-radius:99px;font-size:10px}
.xp-bar{flex:1;height:10px;background:#fff;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.xp-bar>div{height:100%;background:linear-gradient(90deg,var(--m),#00e1ff);width:0%;transition:width .3s}

#stage{flex:1;overflow-y:auto;padding:6px 12px 14px}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:2.5px solid var(--ink)}
#tabs button{font:800 11px Manrope;border:2.5px solid transparent;border-radius:14px;padding:6px 0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#tabs button span{font-size:20px}#tabs .on{background:var(--b);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}

/* GPU MINER */
#gc{position:relative;margin:6px auto 0;width:240px;padding:14px;border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);cursor:pointer;
 background:color-mix(in srgb,var(--p) calc(var(--heat)*100%),#7be9ff);transition:transform .06s,box-shadow .06s;overflow:hidden}
#gc:active{transform:translateY(6px) scale(0.98);box-shadow:0 2px 0 var(--ink)}
.gpu-art{width:100%;height:120px;display:flex;justify-content:center;align-items:center;margin-bottom:6px}
.gpu-art svg{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(21,18,43,.35))}
.fan-spin{transform-origin:center;animation:sp 1.8s linear infinite}
.fast .fan-spin{animation-duration:.22s}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--m);transition:width .15s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats b{display:block;font:900 12px Unbounded}
.hot #gc{animation:shk .12s infinite}@keyframes shk{50%{transform:translate(3px,-2px) rotate(1deg)}}
#lock{position:absolute;inset:0;border-radius:25px;background:rgba(255,93,143,.95);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;color:#fff;font-family:Unbounded;font-weight:900}
.hot #lock{display:flex}
.fl{position:fixed;z-index:90;pointer-events:none;font:900 16px Unbounded;color:var(--ink);background:var(--y);border:2.5px solid var(--ink);border-radius:99px;padding:3px 10px;animation:fl .85s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fl{to{transform:translate(60px,-110px) rotate(14deg) scale(1.1);opacity:0}}

/* LISTS & SHEETS */
.item{display:flex;justify-content:space-between;align-items:center;gap:8px}.item.on{background:#d9fbe9}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{text-align:center;padding:14px 4px;cursor:pointer}
.tile span{font-size:26px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg .on{background:var(--b);color:#fff}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.seg4 .on{background:var(--b);color:#fff}.seg4 .btn{padding:8px 2px;font-size:10px}
#sh{position:absolute;inset:0;background:rgba(21,18,43,.55);display:none;align-items:flex-end;z-index:99}
#sh.open{display:flex}
#sh>div{width:100%;max-height:86%;overflow-y:auto;background:var(--bg);border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#toast{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:110;display:none}
.tg{position:relative;width:52px;height:30px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;flex:none;cursor:pointer}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--ink);transition:.2s}
.tg.on{background:var(--m)}.tg.on:after{left:24px}

/* GAMES FX */
.big{font:900 38px Unbounded}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:230px;margin:auto}
.mine button{aspect-ratio:1;font-size:28px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);transition:transform .2s,background .2s}
.mine button:active{transform:scale(0.92)}
.wheel{width:180px;height:180px;border-radius:50%;border:4px solid var(--ink);margin:6px auto;position:relative;transition:transform 2.4s cubic-bezier(.12,.8,.1,1);box-shadow:0 6px 0 rgba(21,18,43,.2)}
.pin{position:absolute;left:50%;top:-16px;margin-left:-11px;width:0;height:0;border:11px solid transparent;border-top:19px solid var(--ink);z-index:5}
.coin{width:120px;height:120px;margin:12px auto;border:3px solid var(--ink);border-radius:50%;background:linear-gradient(135deg,var(--y),#ff9f1c);display:grid;place-items:center;font:900 38px Unbounded;box-shadow:0 6px 0 var(--ink);transition:transform 1.4s cubic-bezier(.3,1.4,.5,1)}
.cf{position:absolute;top:50%;width:10px;height:14px;border:1.5px solid var(--ink);z-index:95;pointer-events:none;animation:cf 1.2s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.bn{position:absolute;left:50%;top:36%;z-index:96;pointer-events:none;font:900 22px Unbounded;padding:10px 18px;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);white-space:nowrap;animation:bn 1.5s forwards}
.gd{background:var(--m)}.bd{background:var(--p);color:#fff}
@keyframes bn{0%{transform:translate(-50%,20px) scale(.4);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
.clash{animation:cls .22s infinite alternate}@keyframes cls{from{transform:translateX(-10px) rotate(-8deg) scale(1.05)}to{transform:translateX(10px) rotate(8deg) scale(1.05)}}
.jump{animation:jmp .5s 2 ease-out}@keyframes jmp{50%{transform:translateY(-22px) scale(1.15)}}
.flip{animation:flp .4s ease-out}@keyframes flp{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.2)}100%{transform:rotateY(0)}}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}.seg5 .on{background:var(--b);color:#fff}.seg5 .btn{padding:8px 1px;font-size:9px}
.fan-spin{transform-box:fill-box;transform-origin:center}
.fan-spin.rev{animation-direction:reverse}
.rgb{animation:hue 4s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.orb{transform-box:fill-box;transform-origin:center;animation:orbp 1.6s ease-in-out infinite}@keyframes orbp{50%{transform:scale(1.3);opacity:.7}}
.led{animation:ledb 1s steps(2) infinite}@keyframes ledb{50%{opacity:.15}}
.gpu-art{height:130px}
.bob{display:inline-block;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
.gift{display:inline-block;animation:bob 1.2s ease-in-out infinite}
.pop{display:inline-block;animation:popk .45s ease-out}@keyframes popk{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.shk2{animation:shk2 .45s}@keyframes shk2{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
.hit{animation:hitk .3s}@keyframes hitk{30%{transform:scale(.85) rotate(-8deg)}60%{transform:scale(1.12) rotate(6deg)}}
.pulse{animation:pulsek .5s infinite alternate}@keyframes pulsek{to{transform:scale(1.04);box-shadow:0 3px 0 var(--ink),0 0 18px var(--p)}}
.pt{position:absolute;pointer-events:none;z-index:50;font-size:18px;animation:ptk .9s ease-out forwards}
@keyframes ptk{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}}
.surge{position:absolute;z-index:120;animation:pulsek .25s infinite alternate}
.bossface{display:inline-block;animation:bob 2s ease-in-out infinite;user-select:none}
/* колесо */
.wwrap{position:relative;width:216px;height:216px;margin:10px auto}
.wwrap .wheel{position:absolute;left:18px;top:18px;margin:0}
.wwrap .pin{top:-4px;z-index:6}
.wwrap .hub{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--y);border:3px solid var(--ink);display:grid;place-items:center;z-index:4;font-size:20px;box-shadow:0 3px 0 var(--ink)}
.bulb{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--y);border:2px solid var(--ink);transform:rotate(var(--a)) translateY(-104px);animation:blb 1s infinite}
.bulb:nth-child(even){animation-delay:.5s}
@keyframes blb{50%{background:#fff;box-shadow:0 0 8px var(--y)}}
.spinning .bulb{animation-duration:.18s}
.spinning .pin{animation:pinw .12s infinite alternate}@keyframes pinw{to{transform:rotate(-14deg)}}
.winpulse .wheel{animation:winp .4s 3}@keyframes winp{50%{box-shadow:0 0 0 10px rgba(46,229,157,.5),0 6px 0 rgba(21,18,43,.2)}}
/* кирка */
.cave{background:linear-gradient(#2a1d3d,#120c1e);color:#fff}
.cave .mine button{background:#3a2c52;border-color:#0d0818;box-shadow:0 3px 0 #0d0818;color:#fff}
.cave .mine button.gem{background:var(--m);animation:gemk .5s}
.cave .mine button.boom{background:var(--p);animation:shk2 .45s}
.cave .mine button.dig{animation:digk .3s}
@keyframes digk{40%{transform:scale(.8) rotate(-10deg)}70%{transform:scale(1.1) rotate(8deg)}}
@keyframes gemk{0%{transform:scale(.4) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.flashred{animation:fr .5s}@keyframes fr{30%{box-shadow:inset 0 0 0 200px rgba(255,93,143,.45)}}
/* монета */
.coinWrap{perspective:700px;height:170px;display:grid;place-items:center;position:relative}
.coin3{width:112px;height:112px;position:relative;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.2,.8,.25,1)}
.coin3 .fc{position:absolute;inset:0;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font:900 42px Unbounded;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:radial-gradient(circle at 30% 30%,#fff3b0,#ffd23f 45%,#ff9f1c);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35)}
.coin3 .bk{transform:rotateY(180deg);background:radial-gradient(circle at 30% 30%,#e6efff,#8fb0ff 45%,#4d7cff);color:#fff}
.cshadow{position:absolute;bottom:6px;left:50%;width:90px;height:14px;margin-left:-45px;border-radius:50%;background:rgba(21,18,43,.35);opacity:.35}
body[data-th="th_ocean"] #gc{background:linear-gradient(160deg,#4de1ff,#2b6bff)!important}
body[data-th="th_sunset"] #gc{background:linear-gradient(160deg,#ffb347,#ff5d8f)!important}
body[data-th="th_candy"] #gc{background:linear-gradient(160deg,#ffc0f0,#a8f0ff)!important}
body[data-th="th_matrix"] #gc{background:linear-gradient(160deg,#0b3d1e,#18c46a)!important}
</style></head><body>
<div id="app">
<div id="toast"></div>
<div id="top">
  <div id="tick"><div id="tickin"><span class="muted" style="padding:0 10px">Подключение к сети...</span></div></div>
  <div id="balbox">
    <div>
      <div class="muted">Баланс</div>
      <div class="bal disp"><span data-bal>0.00</span> <small>$</small></div>
    </div>
    <div class="col" style="align-items:flex-end;gap:4px">
      <div class="chip disp" style="font-size:13px;background:#c5f7e0">💎 <span data-dia>0.00</span></div>
      <div class="row"><span class="chip" id="onl">🟢 Онлайн: ...</span><span class="chip" id="tchip">🌡 36°C</span></div>
    </div>
  </div>
  <div class="lvl-box">
    <span class="disp lvl-badge" id="lvlBadge">LVL 1</span>
    <div class="xp-bar"><div id="xpFill"></div></div>
    <span class="muted" id="xpText" style="font-size:11px">0/100 XP</span>
  </div>
</div>

<div id="stage"></div>
<nav id="tabs"></nav>
<div id="sh"><div></div></div>
</div>

<script>
/* ===== !!! НАСТРОЙКИ ВАШЕГО БОТА — ЗАМЕНИТЕ НА СВОИ !!! ===== */
const BOT_USERNAME = 'CryptoClickGameBot';      // username вашего бота БЕЗ @ (например MyMinerBot)
const CHANNEL_USERNAME = 'CryptoClickGame';        // username вашего канала БЕЗ @ (бот должен быть админом канала)
const CHANNEL_URL = 'https://t.me/' + CHANNEL_USERNAME;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tgUserId = () => { try { const u = Telegram.WebApp.initDataUnsafe.user; if (u && u.id) return String(u.id); } catch(e){} return localStorage.getItem('gid') || ''; };
const startParam = () => { try { return Telegram.WebApp.initDataUnsafe.start_param || ''; } catch(e){ return ''; } };

/* ===== НАСТРОЙКИ СЕРВЕРА SUPABASE И ОНЛАЙН СИНХРОНИЗАЦИЯ ===== */
const SB_URL='https://qmcvgtkfvsxthukbpafy.supabase.co',SB_KEY='sb_publishable_dmFpfh7OvvYv_LgiP0gSvQ_n124nmga';

/* Данные онлайн из базы данных */
let REAL_TOPS = [];
let REAL_FEED = [];
let REAL_CLANS = [];
let ONLINE_COUNT = 0;
let pend = 0;

/* Генерация / получение реального Telegram ID пользователя */
const creds = () => {
  try {
    const w = Telegram.WebApp;
    if (w.initData) {
      const p = new URLSearchParams(w.initData);
      const h = p.get('hash');
      p.delete('hash');
      return { d: [...p.entries()].map(([k, v]) => k + '=' + v).sort().join('\n'), h };
    }
  } catch(e) {}
  let g = localStorage.getItem('gid');
  if (!g) {
    g = 'u_' + Math.random().toString(36).slice(2, 9);
    localStorage.setItem('gid', g);
  }
  return { d: 'user=' + JSON.stringify({ id: g, first_name: 'Игрок_' + g.slice(-4) }), h: '' };
};

/* Универсальный метод обращения к онлайн API Supabase */
let LASTERR = '';
const QUIET = new Set(['tops','crash','state','mine','clans_list']);
const post = async (method, body = {}, hold = false) => {
  try {
    const c = creds();
    const r = await fetch(SB_URL + '/rest/v1/rpc/api', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY
      },
      body: JSON.stringify({ d: c.d, h: c.h, f: method, a: body })
    });
    const j = await r.json();
    if (!r.ok) { LASTERR = method + ': HTTP ' + r.status + ' ' + (j.message || j.hint || j.details || j.err || ''); if (!QUIET.has(method)) toast('Ошибка сервера', LASTERR.slice(0, 110)); }
    if (j.err) {
      LASTERR = method + ': ' + j.err;
      if (j.err !== 'auth') toast('Сеть', j.err);
      return null;
    }
    if (!r.ok) return null;
    if (Array.isArray(j.hacks) && j.hacks.length) {
      if (j.u) applyServerState(j.u);
      sync();
      j.hacks.forEach(showHackAlert);
    }
    if (Array.isArray(j.duels) && j.duels.length) { if (j.u) applyServerState(j.u); sync(); j.duels.forEach(showDuelNote); }
    if (Array.isArray(j.lot) && j.lot.length) { if (j.u) applyServerState(j.u); sync(); j.lot.forEach(w => { banner('🎰 ДЖЕКПОТ! +' + f2(w.amt) + ' 💎', 1); confetti(120); tone(900); }); }
    if (Array.isArray(j.gifts) && j.gifts.length) {
      if (j.u) applyServerState(j.u);
      sync();
      j.gifts.forEach(g => toast('🎁 Подарок!', g.who + ' отправил вам ' + (+g.amt).toFixed(2) + ' 💎'));
    }
    if (j.u && !hold) {
      applyServerState(j.u);
      sync();
    }
    return j;
  } catch(e) {
    LASTERR = method + ': ' + (e && e.message || e);
    return null;
  }
};

/* Вызов Edge Function game-extra (проверка подписки, рефералы). Работает только внутри Telegram. */
const fx = async (action, extra = {}) => {
  try {
    const initData = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || '';
    if (!initData) return null;
    const r = await fetch(SB_URL + '/functions/v1/game-extra', {
      method: 'POST',
      headers: { 'content-type': 'application/json', apikey: SB_KEY },
      body: JSON.stringify({ initData, action, ...extra })
    });
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) return { err: (j && (j.err || j.message)) || ('HTTP ' + r.status) };
    return j;
  } catch (e) { return { err: 'network' }; }
};

/* Сброс накопленных кликов на сервер */
const flush = async () => {
  const n = pend;
  if (!n) return;
  pend = 0;
  const r = await post('mine', { n });
  if (!r) pend += n;
};
setInterval(flush, 1500);

/* Загрузка реальных топов и онлайна */
async function loadServerData() {
  const j = await post('tops', {}, true);
  if (!j) {
    const t = $('#tickin'), o = $('#onl');
    if (t) t.innerHTML = `<span>⚠️ Нет данных с сервера (${esc(LASTERR || 'нет ответа')})</span>`;
    if (o) o.textContent = '🔴 Онлайн: нет данных';
    return;
  }
  
  REAL_TOPS = (Array.isArray(j.bal) ? j.bal : (Array.isArray(j.earned) ? j.earned : [])).map(t => ({ name: t.name + (t.b ? ' ' + t.b : ''), earned: t.bal !== undefined ? t.bal : t.earned }));
  REAL_FEED = Array.isArray(j.feed) ? j.feed : [];
  ONLINE_COUNT = j.online || 1;
  
  $('#onl').textContent = '🟢 Онлайн: ' + ONLINE_COUNT;
  
  if (REAL_TOPS.length || REAL_FEED.length) {
    const a = [
      ...REAL_TOPS.map((t, i) => `🏆 #${i+1} <b>${esc(t.name)}</b> ${(+t.earned).toFixed(0)} $`),
      ...REAL_FEED.map(f => `🔥 <b>${esc(f.name)}</b> +${(+f.amt).toFixed(2)} 💎`)
    ];
    $('#tickin').innerHTML = [...a, ...a].map(x => `<span>${x}</span>`).join('');
  } else {
    $('#tickin').innerHTML = `<span>🟢 Онлайн в игре: <b>${ONLINE_COUNT}</b> чел.</span>`;
  }
}

let _gid=0;
function gpuSVG(o){
  const id='g'+(++_gid), n=o.fans||2, X=20, W=160, cy=60;
  const slot=W/n, R=Math.min(26,slot/2-6), a=o.acc, b=o.body;
  const r1=v=>+v.toFixed(1);
  let s=`<svg viewBox="0 0 200 112"><defs>
   <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b}"/><stop offset="1" stop-color="#05060c"/></linearGradient>
   <linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
   <linearGradient id="${id}r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5d8f"/><stop offset=".33" stop-color="#ffd23f"/><stop offset=".66" stop-color="#2ee59d"/><stop offset="1" stop-color="#4d7cff"/></linearGradient>
   <radialGradient id="${id}o"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${a}"/><stop offset="1" stop-color="${a}" stop-opacity="0"/></radialGradient>
  </defs>`;
  // планка PCIe
  s+=`<rect x="3" y="22" width="13" height="64" rx="2" fill="#aeb6cc" stroke="#15122b" stroke-width="3"/>
      <rect x="6" y="30" width="7" height="6" rx="1" fill="#15122b"/><rect x="6" y="44" width="7" height="6" rx="1" fill="#15122b"/><rect x="6" y="58" width="7" height="6" rx="1" fill="#15122b"/><rect x="6" y="72" width="7" height="6" rx="1" fill="#15122b"/>`;
  // золотые контакты
  s+=`<rect x="38" y="97" width="96" height="9" rx="1.5" fill="#d9a520" stroke="#15122b" stroke-width="2"/><line x1="41" y1="101.5" x2="131" y2="101.5" stroke="#fff3b0" stroke-width="4.5" stroke-dasharray="2 3"/>`;
  // разъём питания
  s+=`<rect x="128" y="5" width="${o.pw||34}" height="10" rx="2" fill="#15122b"/><rect x="132" y="8" width="${(o.pw||34)-8}" height="4" rx="1" fill="#555c75"/>`;
  // корпус
  if(o.sty==='asic'){
    s+=`<rect x="15" y="10" width="170" height="88" rx="8" fill="#4a4f5c" stroke="#15122b" stroke-width="4"/><rect x="21" y="16" width="158" height="76" rx="4" fill="#2c303b" stroke="#15122b" stroke-width="2"/>`;
    for(let i=0;i<9;i++)s+=`<rect x="${25+i*17}" y="20" width="12" height="3" rx="1.5" fill="#15122b"/>`;
    for(let i=0;i<6;i++)s+=`<circle class="led" style="animation-delay:${i*.17}s" cx="${30+i*9}" cy="87" r="2.2" fill="${a}"/>`;
  } else {
    s+=`<rect x="15" y="12" width="170" height="86" rx="14" fill="url(#${id}b)" stroke="#15122b" stroke-width="4"/>
        <g stroke="${a}" stroke-width="1.4" opacity=".16">`;
    for(let x=24;x<178;x+=6)s+=`<line x1="${x}" y1="20" x2="${x-6}" y2="88"/>`;
    s+=`</g><rect x="15" y="12" width="170" height="86" rx="14" fill="url(#${id}s)"/>
        <path d="M27 18 H173" stroke="${a}" stroke-width="3" stroke-linecap="round"/>`;
  }
  // вентиляторы
  if(o.sty==='plasma'){
    s+=`<circle cx="100" cy="${cy}" r="31" fill="#0a0b12" stroke="${a}" stroke-width="2"/>
        <g transform="translate(100 ${cy})"><g class="fan-spin"><circle r="29" fill="none"/><circle r="26" fill="none" stroke="${a}" stroke-width="3" stroke-dasharray="14 8"/></g></g>
        <g transform="translate(100 ${cy})"><g class="fan-spin rev"><circle r="21" fill="none"/><circle r="19" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 7"/></g></g>
        <circle class="orb" cx="100" cy="${cy}" r="14" fill="url(#${id}o)"/>`;
  } else {
    for(let k=0;k<n;k++){
      const cx=r1(X+slot*(k+.5));
      s+=`<circle cx="${cx}" cy="${cy}" r="${r1(R+4)}" fill="#0a0b12" stroke="${a}" stroke-width="1.6"/>`;
      let bl='';
      const B=o.blades||9;
      for(let i=0;i<B;i++){
        bl+=`<path transform="rotate(${r1(360/B*i)})" d="M0,${r1(-R*.22)} C${r1(R*.38)},${r1(-R*.32)} ${r1(R*.52)},${r1(-R*.8)} ${r1(R*.13)},${r1(-R)} C${r1(-R*.26)},${r1(-R*.74)} ${r1(-R*.18)},${r1(-R*.4)} 0,${r1(-R*.22)}Z" fill="${a}" fill-opacity=".92" stroke="#15122b" stroke-width="1"/>`;
      }
      s+=`<g transform="translate(${cx} ${cy})"><g class="fan-spin${k%2&&o.rev?' rev':''}"><circle r="${r1(R)}" fill="none"/>${bl}</g><circle r="${r1(R*.27)}" fill="#15122b" stroke="${a}" stroke-width="2"/><circle r="${r1(R*.1)}" fill="${a}"/></g>`;
      if(o.sty==='quantum'&&k===1)s+=`<g transform="translate(${cx} ${cy})"><g class="fan-spin rev"><circle r="${r1(R+8)}" fill="none"/><circle r="${r1(R+8)}" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="3 6"/></g></g><circle class="orb" cx="${cx}" cy="${cy}" r="9" fill="url(#${id}o)"/>`;
    }
  }
  if(o.rgb)s+=`<rect class="rgb" x="30" y="89" width="140" height="3.6" rx="2" fill="url(#${id}r)"/>`;
  s+=`<text x="${o.sty==='asic'?27:25}" y="${o.sty==='asic'?32:27}" fill="${a}" font-family="Unbounded,sans-serif" font-weight="900" font-size="7.5" opacity=".95">${o.tag||''}</text></svg>`;
  return s;
}

  if (u.items) S.items = u.items;
  if (u.bmul !== undefined) S.boostMul = +u.bmul;
  if (u.ac !== undefined) S.ac = +u.ac;
  if (u.fan !== undefined) S.fan = +u.fan;
  if (u.lvl !== undefined) {

    if (!S._lvlInit || sl > S.lvl || (sl === S.lvl && sx > S.xp)) { S.lvl = sl; S.xp = sx; }

let acx;
const tone=(f,t='sine',d=.08,v=.08)=>{
  if(!S.snd)return;
  try{
    acx=acx||new(window.AudioContext||window.webkitAudioContext)();
    const o=acx.createOscillator(),g=acx.createGain();
    o.type=t;o.frequency.value=f;g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(.001,acx.currentTime+d);
    o.connect(g).connect(acx.destination);
    o.start();o.stop(acx.currentTime+d);
  }catch(e){}
};

function mineCore(x,y,auto){
  S.temp=Math.min(100,S.temp+1.9*FH()*GPU[S.gpu].ht);
  S.clicks++;
  const mult=IM();
  const r=GPU[S.gpu].r*mult;
  S.bal+=r;S.earned+=r;
  pend++;
  if(!bossOff)bossPend++;
  addXP(1);
  sync();
  
  const gVis=$('#gpuVisual');
  if(gVis){
    gVis.classList.add('fast');
    clearTimeout(window.gvt);
    window.gvt=setTimeout(()=>gVis.classList.remove('fast'),400);
    const c=document.createElement('div');
    c.className='fl';
    const fxs=FXMAP[(S.skin||{}).fx]||['₿','Ξ','💎','₮']; c.textContent=fxs[rnd()*fxs.length|0]+' +'+f2(r);
    c.style.left=(x-30+rnd()*30)+'px';
    c.style.top=(y-30)+'px';
    document.body.append(c);
    setTimeout(()=>c.remove(),850);
  }
  
  if(!auto){tone(480+rnd()*180,'triangle',.05);hap()}
  if(S.temp>=100&&(S.items.fuse||0)>0){
    S.items.fuse--;S.temp=70;post('use_item',{id:'fuse'},true);banner('🧯 Предохранитель спас!',1);

    tone(170,'sawtooth',.4,.2);hap('heavy');
  }
  heatUI();
}

/* Реальная проверка подписки: сервер вызывает Bot API getChatMember */
async function verifySub(){
  toast('Проверка...','Смотрим вашу подписку на канал');
  const j = await fx('check_sub');
  if (!j) { toast('Проверка недоступна','Откройте игру внутри Telegram и попробуйте ещё раз'); return; }
  if (j.sub === true) {
    S.tgChannelJoined = true;
    toast('Подписка подтверждена','Можно забирать награду');
  } else {
    S.tgChannelJoined = false;
    toast('Вы не подписаны','Подпишитесь на канал и повторите проверку');
  }
  openTasks();
}

function openTasks(){
  const list=TASKS.map(t=>{
    const done=!!S.tasks[t.id];
    const canClaim=t.check()&&!done;

    let actionBtn='';
    if(done){
      actionBtn='<span class="chip">Выполнено</span>';
    }else if(t.isChannel && !S.tgChannelJoined){
      actionBtn=`<button class="btn b sm" onclick="openChannel()">Подписаться</button>
        <button class="btn w sm" style="margin-top:4px" onclick="verifySub()">Проверить</button>`;
    }else{
      actionBtn=`<button class="btn ${canClaim?'g':'w'} sm" ${!canClaim?'disabled':''} onclick="claimTask('${t.id}')">${canClaim?'Забрать':'В процессе'}</button>`;
    }

    return `
    <div class="card item ${done?'on':''}">
      <div style="flex:1">
        <b>${t.t}</b>
        <div class="muted">${t.d}</div>
        <div class="chip" style="margin-top:4px;display:inline-block;background:#ffd23f">${t.r} · +${t.xp} XP</div>
      </div>
      <div>
        ${actionBtn}
      </div>
    </div>`;
  }).join('');
  
  sheet(`<h3 class="disp" style="margin-top:0">📋 Задания</h3><div class="col">${list}</div>`);
}

async function claimTask(id){
  const t=TASKS.find(x=>x.id==id);
  if(!t||S.tasks[id])return;
  if(t.isChannel){
    const c = await fx('check_sub');
    if(!(c && c.sub === true)){ S.tgChannelJoined=false; toast('Вы не подписаны','Подпишитесь на канал'); return openTasks(); }
  }
  const j = await post('task_claim', { id });
  if(j){
    S.tasks[id]=1;
    loc(j,()=>{S.dia+=t.dia;S.bal+=t.usd});
    addXP(t.xp);
    confetti(30);
    banner(`Награда: ${t.r}`,1);
    sync();openTasks();
  }
}

async function createRealClan(){
  const name=$('#clanName').value.trim();
  const tag=$('#clanTag').value.trim()||'';
  if(!name)return toast('Ошибка','Введите название клана');
  if(S.dia<10)return toast('Мало 💎','Для создания нужно 10 алмазов');
  
  const j = await post('clan_create', { name, tag });
  if (j && !j.err) {
    loc(j,()=>{S.dia-=10});
    S.clan={name,tag,isOwner:true,bonus:4,members:1,tax:5,treasury:0,isPrivate:false};
    confetti(40);banner('КЛАН СОЗДАН!',1);
    sync();openClans();
  }
}

async function joinRealClan(clanId){
  const j = await post('clan_join', { clanId });
  if (j && !j.err) {
    S.clan = j.clan;
    confetti(25);toast('Успешно!','Вы вступили в клан');
    sync();openClans();
  }
}

async function clanTax(t){
  if(S.clan){
    await post('clan_update', { tax: t });
    S.clan.tax = t;
    openClans();
    toast('Налог изменён', t+'%');
  }
}

async function toggleClanPrivacy(){
  if(S.clan){
    const next = !S.clan.isPrivate;
    await post('clan_update', { isPrivate: next });
    S.clan.isPrivate = next;
    openClans();
  }
}

async function upgradeClan(){
  if(S.dia<5)return toast('Не хватает 💎','Требуется 5 💎');
  const j = await post('clan_upgrade');
  if (j) {
    loc(j,()=>{S.dia-=5});
    S.clan.bonus+=2;
    confetti(25);
    sync();openClans();
    toast('Апгрейд пула!','Мощность клана выросла');
  }
}

async function leaveClan(){
  await post('clan_leave');
  S.clan=null;
  sync();openClans();
  toast('Вы вышли из клана','');
}

async function doExch(){
  await flush();
  const val=+($('#exInput').value)||0;

const burst=(box,btn,emos,n=10)=>{
  if(!box||!btn)return;
  const r=btn.getBoundingClientRect(),q=box.getBoundingClientRect();
  const cx=r.left-q.left+r.width/2, cy=r.top-q.top+r.height/2;

const rest = async (path, opt = {}) => {
  const r = await fetch(SB_URL + '/rest/v1/' + path, {
    ...opt,
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'content-type': 'application/json', ...(opt.headers || {}) }
  });
  if (!r.ok) throw new Error(String(r.status));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
};
const sheetOpen = () => $('#sh').classList.contains('open');

/* --- Чат --- */
let chatIv = null, chatLast = 0;
async function openChat(){
  sheet(`<h3 class="disp" style="margin-top:0">💬 Общий чат</h3>
    <div id="chatBox" class="col" style="height:42vh;overflow-y:auto"><span class="muted">Загрузка...</span></div>
    <div class="row" style="margin-top:8px"><input id="chatIn" maxlength="120" placeholder="Сообщение..."><button class="btn g sm" onclick="sendChat()">➤</button></div>`);
  $('#chatIn').onkeydown = e => { if (e.key === 'Enter') sendChat(); };
  await loadChat();
  clearInterval(chatIv);
  chatIv = setInterval(() => { if (!$('#chatBox') || !sheetOpen()) { clearInterval(chatIv); return; } loadChat(); }, 4000);
}
async function loadChat(){
  const box = $('#chatBox'); if (!box) return;
  try {
    const rows = await rest('chat?select=name,msg,created_at&order=created_at.desc&limit=40');
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.innerHTML = rows.reverse().map(m => `<div class="card" style="padding:6px 10px"><b style="font-size:11px">${esc(m.name)}</b> <span class="muted" style="font-size:10px">${new Date(m.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</span><div>${esc(m.msg)}</div></div>`).join('') || '<div class="muted">Пока тихо. Напишите первым!</div>';
    if (stick) box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.innerHTML = '<div class="card muted">Чат ещё не подключён: выполните supabase_online.sql в Supabase</div>';
  }
}
async function sendChat(){
  const inp = $('#chatIn'); if (!inp) return;
  const msg = inp.value.trim().slice(0, 120);
  if (!msg) return;
  if (Date.now() - chatLast < 3000) return toast('Не так быстро', 'Подождите пару секунд');
  chatLast = Date.now(); inp.value = '';
  try {
    await rest('chat', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ uid: tgUserId(), name: String(S.user).slice(0, 32), msg }) });
    await loadChat(); const b = $('#chatBox'); if (b) b.scrollTop = b.scrollHeight;
  } catch (e) { toast('Ошибка', 'Не удалось отправить сообщение'); }
}

/* --- Мировой босс: все игроки бьют одного босса кликами --- */
let BOSS = null, bossPend = 0, bossOff = false, bossBusy = false;
const BOSS_ICONS = ['👹','🐲','👾','🦖','☠️','🐙','🦑','👽'];
async function bossFlush(){
  if (bossOff || bossBusy) return;
  const n = bossPend;
  if (!n && !$('#bossBox')) return;
  bossBusy = true; bossPend = 0;
  try {
    const st = n > 0
      ? await rest('rpc/boss_hit', { method: 'POST', body: JSON.stringify({ n: Math.min(n, 120), p_uid: tgUserId(), p_name: String(S.user).slice(0, 32) }) })
      : await rest('rpc/boss_state', { method: 'POST', body: '{}' });
    if (n > 120) bossPend += n - 120;
    if (st) {
      if (BOSS && st.lvl > BOSS.lvl) { banner('👹 БОСС ПОВЕРЖЕН!', 1); confetti(50); tone(950, 'triangle', .3, .3); }
      BOSS = st;
      if ($('#bossBox')) renderBoss();
    }
  } catch (e) {
    bossPend += n;
    if (String(e.message) === '404') bossOff = true;
  }
  bossBusy = false;
}
setInterval(bossFlush, 4000);

function renderBoss(){
  const box = $('#bossBox'); if (!box) return;
  if (bossOff || !BOSS) { box.innerHTML = '<div class="card muted">Босс ещё не подключён: выполните supabase_online.sql в Supabase</div>'; return; }
  const pct = Math.max(0, Math.min(100, BOSS.hp / BOSS.max * 100));
  box.innerHTML = `
    <div class="card" style="text-align:center">
      <div class="big bossface" id="bossFace" onclick="hitBoss()" style="cursor:pointer">${BOSS_ICONS[(BOSS.lvl - 1) % BOSS_ICONS.length]}</div>
      <div class="disp" style="font-size:13px">Мировой босс · ур. ${BOSS.lvl}</div>
      <div class="bar" style="margin:8px 0"><i style="width:${pct}%;background:var(--p)"></i></div>
      <div class="muted">${nf(Math.max(0, BOSS.hp))} / ${nf(BOSS.max)} HP · бей кликами по карте или по боссу!</div>
    </div>
    <b class="disp" style="font-size:12px">Топ урона</b>
    <div class="col" style="margin-top:6px">${(BOSS.top || []).map((t, i) => `<div class="card item"><span><b>${i + 1}.</b> ${esc(t.name)}</span><b class="disp" style="font-size:12px">${nf(+t.dmg)}</b></div>`).join('') || '<div class="card muted" style="text-align:center">Пока никто не бил босса</div>'}</div>`;
}
function hitBoss(){
  bossPend++; tone(200 + rnd() * 80, 'square', .05, .08); hap();
  const f = $('#bossFace'); if (f) shake(f, 'hit');
  if (BOSS) { BOSS.hp = Math.max(0, BOSS.hp - 1); renderBoss(); }
}
async function openBoss(){
  bossOff = false;
  sheet(`<h3 class="disp" style="margin-top:0">👹 Мировой босс</h3><div id="bossBox"><span class="muted">Загрузка...</span></div>`);
  await bossFlush();
  if (!BOSS && !bossOff) { try { BOSS = await rest('rpc/boss_state', { method: 'POST', body: '{}' }); } catch (e) { if (String(e.message) === '404') bossOff = true; } }
  renderBoss();
}

async function startHack(t,target){

  const b=$('#hkBox'); if(!b||!HK)return;
  const rows=HK.hist.map(h=>`<div class="card item" style="padding:6px 12px"><b class="disp">${h.g}</b><span>${'🟩'.repeat(h.h)}${'🟨'.repeat(h.n)}${(h.h+h.n)?'':'⬛'}</span></div>`).join('');

async function guessHack(){
  const g=($('#hkIn').value||'').trim();
  const j=await post('hack_guess',{g},true);
  if(!j||!j.hack)return;
  const h=j.hack; if(h.last)HK.hist.push(h.last);
  if(j.u){applyServerState(j.u);sync();}
  if(!h.done){HK.tries=h.tries;tone(400);return renderHack();}
  HK.tries=0;
  if(h.win){confetti(50);banner('💻 Взлом удался!',1);tone(900);

        <div class="card"><div class="muted">Никнейм</div><b>${esc(S.user)}</b></div>
        <div class="card"><div class="muted">Уровень</div><b>LVL ${S.lvl}</b></div>
        <div class="card"><div class="muted">Кликов в базе</div><b>${S.clicks}</b></div>
        <div class="card"><div class="muted">Заработано</div><b>${f2(S.earned)} $</b></div>
      </div>
    </div>`;
}

/* ===== НАВИГАЦИЯ И СТАРТ ===== */
const TABS=[['⛏️','Майнинг',tabMine],['🎮','Игры',tabGames],['🛒','Гараж',tabGarage],['☰','Ещё',tabMore]];
function go(i){
  stopGame&&stopGame();stopGame=null;
  [...$('#tabs').children].forEach((b,j)=>b.classList.toggle('on',i==j));
  TABS[i][2]();
  $('#stage').scrollTop=0;
  tone(520,'sine',.04);hap();
}

$('#tabs').innerHTML=TABS.map((t,i)=>`<button onclick="go(${i})"><span>${t[0]}</span>${t[1]}</button>`).join('');

async function bootOnline(){
  try{
    const w=Telegram.WebApp;
    w.ready();w.expand();
    w.setHeaderColor('#e8e4ff');w.setBackgroundColor('#e8e4ff');
    const u=w.initDataUnsafe&&w.initDataUnsafe.user;
    if(u) S.user=u.username ? ('@'+u.username) : (u.first_name || S.user);
  }catch(e){}

  const j = await post('state');
  if (j) {
    if (j.name) S.user = j.name;
    applyServerState(j);
  }
  sync();
  loadServerData();
  go(0);
  if (!S.stc) setTimeout(openStreak, 900);
  /* рефералы в фоне, не блокируют запуск */
  (async () => {
    const sp = startParam();
    if (/^ref_\d+$/.test(sp) && !localStorage.getItem('ref_done')) {
      const rr = await post('ref_reg', { ref: sp.slice(4) }, true);
      if (rr && rr.ref && (rr.ref.ok || ['dup','self','no_referrer','not_new'].includes(rr.ref.why))) localStorage.setItem('ref_done', '1');
    }
    const gp = startParam();
    if (/^gift_[A-Za-z0-9]+$/.test(gp) && !localStorage.getItem('gift_' + gp)) {
      const g = await post('gift_claim', { code: gp.slice(5) });
      localStorage.setItem('gift_' + gp, '1');
      if (g && g.gift_got) { banner('🎁 +' + f2(g.gift_got.amt) + ' 💎', 1); confetti(40); toast('Подарок получен', 'от ' + g.gift_got.from); }
    }
    syncRefs();
    setInterval(syncRefs, 120000);
  })();
}

bootOnline();

/* ===== ОНЛАЙН-ПУЛЬС И ТИХИЙ ПЕРЕЗАПУСК КАЖДЫЕ 10 МИНУТ ===== */
async function heartbeat(){
  const j = await post('state', {}, true);
  if (j && j.online) { ONLINE_COUNT = j.online; const o = $('#onl'); if (o) o.textContent = '🟢 Онлайн: ' + ONLINE_COUNT; }
}
setInterval(heartbeat, 8000);
async function softRestart(){
  try {
    await flush();
    await post('save_lvl', { lvl: S.lvl, xp: Math.floor(S.xp) }, true);
    const j = await post('state');            // свежее состояние игрока
    if (j && j.name) S.user = j.name;
    await loadServerData(); sync();
    if (typeof loadRealClans === 'function') loadRealClans();
  } catch(e) {}
}
setInterval(softRestart, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { post('save_lvl', { lvl: S.lvl, xp: Math.floor(S.xp) }, true); } else { heartbeat(); loadServerData(); } });
try { Telegram.WebApp.onEvent('activated', () => { heartbeat(); loadServerData(); }); } catch(e) {}
</script>
