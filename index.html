<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CyberMiner Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #04070c;
      --card-bg: rgba(7, 14, 22, 0.78);
      --neon-cyan: #00f2fe;
      --neon-green: #10e599;
      --neon-purple: #7928ca;
      --neon-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-dim: #718096;
      --font-mono: "SF Mono", "Fira Code", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(0, 242, 254, 0.12) 0%, transparent 65%),
        linear-gradient(rgba(0, 242, 254, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 14px calc(76px + env(safe-area-inset-bottom, 10px)) 14px;
      overflow-x: hidden;
      position: relative;
    }

    .app-viewport {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* 1. Верхняя кнопка "НОВОСТИ" */
    .top-pill-capsule {
      width: 82%;
      max-width: 320px;
      height: 38px;
      background: rgba(10, 18, 28, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.15), inset 0 0 8px rgba(0, 242, 254, 0.1);
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }
    .top-pill-capsule:active {
      transform: scale(0.97);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
    }
    .top-pill-text {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 800;
      color: var(--neon-cyan);
      text-transform: uppercase;
    }

    /* 2. Капсула БАЛАНСА прямо под новостями */
    .balance-capsule {
      width: 76%;
      max-width: 290px;
      height: 40px;
      background: rgba(5, 18, 20, 0.85);
      border: 1.5px solid var(--neon-green);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(16, 229, 153, 0.28), inset 0 0 12px rgba(16, 229, 153, 0.12);
      position: relative;
    }
    .crypto-coin-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--neon-green);
      color: #03120c;
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px var(--neon-green);
    }
    .balance-title-num {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
    }

    /* Всплывающий текст дохода (+USDT) */
    .floating-income {
      position: absolute;
      top: -14px;
      right: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 900;
      color: var(--neon-green);
      pointer-events: none;
      animation: floatIncome 1.1s forwards ease-out;
    }
    @keyframes floatIncome {
      0% { opacity: 0; transform: translateY(4px) scale(0.85); }
      20% { opacity: 1; transform: translateY(-4px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-22px) scale(0.9); }
    }

    /* 3. Центр: Слайдер с картой и неоновыми стрелками по бокам */
    .hero-slider-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 2px;
    }

    .arrow-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(8, 16, 24, 0.85);
      border: 1.5px solid rgba(0, 242, 254, 0.45);
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.2);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .arrow-btn:active {
      transform: scale(0.9);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.45);
    }

    /* Главная неоновая карточка видеокарты */
    .gpu-main-card {
      flex: 1;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1.5px solid var(--neon-cyan);
      border-radius: 22px;
      padding: 16px 14px 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 26px rgba(0, 242, 254, 0.22), inset 0 0 16px rgba(0, 242, 254, 0.08);
      position: relative;
      overflow: hidden;
    }

    /* 3D Витрина видеокарты с крутящимися кулерами */
    .gpu-3d-stage {
      width: 100%;
      height: 165px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
      margin-bottom: 4px;
    }

    .gpu-3d-body {
      width: 220px;
      height: 125px;
      background: linear-gradient(135deg, #0b1320 0%, #151f30 100%);
      border: 1.5px solid rgba(0, 242, 254, 0.6);
      border-radius: 16px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 24px rgba(0, 242, 254, 0.35);
      animation: hoverGpu 4s ease-in-out infinite alternate;
      transform-style: preserve-3d;
    }
    @keyframes hoverGpu {
      0% { transform: translateY(0px) rotateX(10deg) rotateY(-8deg); }
      100% { transform: translateY(-8px) rotateX(12deg) rotateY(6deg); }
    }

    .gpu-fan {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle, #050b14 30%, #101c2e 100%);
      border: 2px dashed var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }
    .gpu-fan::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 2px dotted rgba(121, 40, 202, 0.85);
      border-radius: 50%;
      animation: spinFan 1.4s linear infinite;
    }
    .gpu-fan-center {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00f2fe;
      box-shadow: 0 0 8px #00f2fe;
      z-index: 2;
    }
    @keyframes spinFan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Название и спецификации */
    .gpu-name-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      margin-top: 6px;
      text-transform: uppercase;
      text-align: center;
    }

    .specs-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 10px 0 14px 0;
      padding: 0 10px;
    }
    .spec-line {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-family: var(--font-mono);
    }
    .spec-label { color: var(--text-dim); }
    .spec-val { color: #fff; font-weight: 700; }

    /* Кнопки внутри карточки (Забрать / Продать) */
    .card-actions-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card-btn {
      height: 42px;
      border-radius: 22px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      text-transform: lowercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-claim-coins {
      background: rgba(16, 229, 153, 0.15);
      border: 1.5px solid var(--neon-green);
      color: #fff;
      box-shadow: 0 0 14px rgba(16, 229, 153, 0.3);
    }
    .btn-sell-card {
      background: rgba(121, 40, 202, 0.2);
      border: 1.5px solid #a855f7;
      color: #e9d5ff;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.25);
    }

    /* 4. Нижнее меню с мягкой анимацией увеличения и осветления */
    .bottom-capsule-dock {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom, 8px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 410px;
      height: 52px;
      background: rgba(8, 14, 22, 0.92);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 28px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 4px;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 16px rgba(0, 242, 254, 0.12);
      z-index: 100;
    }

    /* Анимация нажатия нижней кнопки: плавно увеличивается, светлеет, затем возвращается */
    .dock-pill-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 24px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background 0.3s ease,
                  color 0.3s ease,
                  border-color 0.3s ease,
                  box-shadow 0.3s ease;
      will-change: transform;
    }

    /* При нажатии: плавно становится больше, светлеет фон и неон */
    .dock-pill-btn:active, .dock-pill-btn.pulse-active {
      transform: scale(1.08);
      background: rgba(0, 242, 254, 0.18);
      color: #ffffff;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.45);
      filter: brightness(1.3);
    }

    .dock-pill-btn.active {
      background: rgba(0, 242, 254, 0.12);
      color: #fff;
      border-color: rgba(0, 242, 254, 0.4);
    }

    /* Модальное окно (Новости / Настройки / Меню) */
    .modal-sheet {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 12, 0.95);
      backdrop-filter: blur(20px);
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-sheet.active { display: flex; }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
    }
    .btn-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <!-- 1. Верхняя кнопка "НОВОСТИ" -->
    <div class="top-pill-capsule" id="btnOpenNews">
      <span class="top-pill-text">НОВОСТИ</span>
    </div>

    <!-- 2. БАЛАНС под новостями -->
    <div class="balance-capsule">
      <div class="crypto-coin-badge">₮</div>
      <span class="balance-title-num">БАЛАНС: <span id="balanceText">1,500</span> USDT</span>
      <div id="floatingCoinContainer"></div>
    </div>

    <!-- 3. Центральный блок: стрелка влево + карточка видеокарты + стрелка вправо -->
    <div class="hero-slider-wrap">
      <button class="arrow-btn" id="btnPrevGpu">&#10094;</button>

      <main class="gpu-main-card">
        <!-- 3D витрина видеокарты -->
        <div class="gpu-3d-stage">
          <div class="gpu-3d-body">
            <div class="gpu-fan"><div class="gpu-fan-center"></div></div>
            <div class="gpu-fan"><div class="gpu-fan-center"></div></div>
          </div>
        </div>

        <h2 class="gpu-name-title" id="gpuCardTitle">RTX 4090 CYBER</h2>

        <div class="specs-list">
          <div class="spec-line">
            <span class="spec-label">Хешрейт:</span>
            <span class="spec-val" id="specHashrate">185 MH/s</span>
          </div>
          <div class="spec-line">
            <span class="spec-label">Потребление:</span>
            <span class="spec-val" id="specPower">450W</span>
          </div>
          <div class="spec-line">
            <span class="spec-label">Температура:</span>
            <span class="spec-val" id="specTemp">64°C</span>
          </div>
          <div class="spec-line">
            <span class="spec-label">Эмиссия:</span>
            <span class="spec-val" style="color:var(--neon-green);" id="specIncome">+0.5 USDT/с</span>
          </div>
        </div>

        <div class="card-actions-row">
          <button class="card-btn btn-claim-coins" id="btnCollectIncome">забрать монеты</button>
          <button class="card-btn btn-sell-card" id="btnSellCard">продать карту</button>
        </div>
      </main>

      <button class="arrow-btn" id="btnNextGpu">&#10095;</button>
    </div>

  </div>

  <!-- 4. Нижнее меню: Профиль | Меню | Настройки с плавной анимацией нажатия -->
  <nav class="bottom-capsule-dock">
    <button class="dock-pill-btn" id="dockBtnProfile">
      <span>👤</span>
      <span>профиль</span>
    </button>
    <button class="dock-pill-btn active" id="dockBtnMenu">
      <span>▦</span>
      <span>меню</span>
    </button>
    <button class="dock-pill-btn" id="dockBtnSettings">
      <span>⚙️</span>
      <span>настройки</span>
    </button>
  </nav>

  <!-- Модальное окно для разделов -->
  <div class="modal-sheet" id="infoModal">
    <div class="modal-head">
      <h3 id="modalTitle" style="color:var(--neon-cyan);">Раздел</h3>
      <button class="btn-close" id="btnCloseModal">&times;</button>
    </div>
    <div id="modalContent" style="font-size:13px; color:var(--text-dim); line-height:1.6;"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const Haptic = {
      light: () => tg?.HapticFeedback?.impactOccurred('light'),
      medium: () => tg?.HapticFeedback?.impactOccurred('medium'),
      success: () => tg?.HapticFeedback?.notificationOccurred('success')
    };

    // Каталог видеокарт
    const GPU_INVENTORY = [
      { name: "RTX 4090 CYBER", hashrate: "185 MH/s", power: "450W", temp: "64°C", rate: 0.8, price: 2600 },
      { name: "RTX 3080 TI PRO", hashrate: "95 MH/s", power: "320W", temp: "68°C", rate: 0.4, price: 950 },
      { name: "H100 TENSOR 80G", hashrate: "460 MH/s", power: "700W", temp: "58°C", rate: 2.2, price: 6800 },
      { name: "RX 6700 XT PULSE", hashrate: "48 MH/s", power: "180W", temp: "62°C", rate: 0.2, price: 340 }
    ];

    let currentCardIndex = 0;
    let balance = 1500;
    let accumulatedIncome = 0;

    function renderActiveCard() {
      const card = GPU_INVENTORY[currentCardIndex];
      document.getElementById('gpuCardTitle').textContent = card.name;
      document.getElementById('specHashrate').textContent = card.hashrate;
      document.getElementById('specPower').textContent = card.power;
      document.getElementById('specTemp').textContent = card.temp;
      document.getElementById('specIncome').textContent = `+${card.rate} USDT/с`;
      document.getElementById('btnSellCard').textContent = `продать (${card.price}$)`;
    }

    function updateBalanceUI() {
      document.getElementById('balanceText').textContent = Math.floor(balance).toLocaleString('ru-RU');
    }

    function showIncomeFloat(amount) {
      if (amount <= 0) return;
      const wrap = document.getElementById('floatingCoinContainer');
      const el = document.createElement('div');
      el.className = 'floating-income';
      el.textContent = `+${amount} USDT`;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }

    // Пассивное начисление монет
    setInterval(() => {
      const currentRate = GPU_INVENTORY[currentCardIndex].rate;
      accumulatedIncome += currentRate;
      document.getElementById('btnCollectIncome').textContent = `забрать (+${accumulatedIncome.toFixed(1)})`;
    }, 1000);

    // Сбор накопленных монет
    document.getElementById('btnCollectIncome').addEventListener('click', () => {
      if (accumulatedIncome < 1) return;
      const claimed = Math.floor(accumulatedIncome);
      balance += claimed;
      accumulatedIncome = 0;
      document.getElementById('btnCollectIncome').textContent = 'забрать монеты';
      showIncomeFloat(claimed);
      Haptic.success();
      updateBalanceUI();
    });

    // Продажа текущей карты
    document.getElementById('btnSellCard').addEventListener('click', () => {
      const card = GPU_INVENTORY[currentCardIndex];
      balance += card.price;
      showIncomeFloat(card.price);
      Haptic.medium();
      updateBalanceUI();
    });

    // Переключение видеокарт стрелками
    document.getElementById('btnNextGpu').addEventListener('click', () => {
      currentCardIndex = (currentCardIndex + 1) % GPU_INVENTORY.length;
      Haptic.light();
      renderActiveCard();
    });

    document.getElementById('btnPrevGpu').addEventListener('click', () => {
      currentCardIndex = (currentCardIndex - 1 + GPU_INVENTORY.length) % GPU_INVENTORY.length;
      Haptic.light();
      renderActiveCard();
    });

    // Модальные окна
    const modal = document.getElementById('infoModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');

    function openModal(title, html) {
      modalTitle.textContent = title;
      modalContent.innerHTML = html;
      modal.classList.add('active');
      Haptic.light();
    }

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    document.getElementById('btnOpenNews').addEventListener('click', () => {
      openModal("СИСТЕМНЫЕ НОВОСТИ", `
        <p>• <b>Патч v3.2:</b> Выпущен новый ASIC Antminer S21 с пониженным энергопотреблением.</p><br>
        <p>• <b>Событие:</b> Удвоенный хешрейт на пуле в эти выходные!</p><br>
        <p>• <b>Безопасность:</b> Не забывайте прокачивать квантовый файрвол для защиты от хакеров.</p>
      `);
    });

    // Плавный отклик кнопок нижнего меню
    const dockButtons = document.querySelectorAll('.dock-pill-btn');
    dockButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        dockButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Принудительный триггер анимации увеличения и осветления
        btn.classList.add('pulse-active');
        setTimeout(() => btn.classList.remove('pulse-active'), 320);

        Haptic.light();

        if (btn.id === 'dockBtnProfile') {
          openModal("ПРОФИЛЬ МАЙНЕРА", `
            <p>ID: <b>#701429</b></p>
            <p>Статус: <b>Cyber-NetRunner</b></p>
            <p>Всего добыто: <b>14,820 USDT</b></p>
          `);
        } else if (btn.id === 'dockBtnSettings') {
          openModal("НАСТРОЙКИ", `
            <p>• Тактильная отдача: <b>ВКЛ</b></p><br>
            <p>• Качество графики: <b>ULTRA NEON</b></p><br>
            <p>• Звук кулеров: <b>ВЫКЛ</b></p>
          `);
        }
      });
    });

    // Старт
    renderActiveCard();
    updateBalanceUI();
  </script>
</body>
</html>
