<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8e4ff"><title>Crypto Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#e8e4ff;--ink:#15122b;--y:#ffd23f;--p:#ff5d8f;--m:#2ee59d;--b:#4d7cff;--heat:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{margin:0;background:#cdc7f4;font:700 14px Manrope,sans-serif;color:var(--ink);display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;background:var(--bg) radial-gradient(rgba(21,18,43,.13) 1.3px,transparent 1.5px) 0 0/22px 22px;overflow:hidden}
.disp{font-family:Unbounded,sans-serif;font-weight:900}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:12px}
.btn{font:800 13px Unbounded,sans-serif;border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--y);box-shadow:0 3px 0 var(--ink);color:var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:none}.btn:disabled{opacity:.4}
.g{background:var(--m)}.r{background:var(--p)}.w{background:#fff}.b{background:var(--b);color:#fff}.sm{padding:7px 10px;font-size:11px}.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.sp{justify-content:space-between}
input{font:800 15px Unbounded,sans-serif;border:2.5px solid var(--ink);border-radius:12px;padding:9px;width:100%;min-width:0;background:#fff;color:var(--ink)}
.chip{border:2px solid var(--ink);border-radius:99px;padding:3px 9px;font-size:11px;background:#fff;white-space:nowrap}
.muted{opacity:.6;font-size:12px}
/* HUD */
#top{padding:calc(10px + env(safe-area-inset-top)) 12px 6px;display:flex;flex-direction:column;gap:8px}
#tick{overflow:hidden;border:2.5px solid var(--ink);border-radius:99px;background:var(--y);padding:5px 0}
#tick>div{display:flex;width:max-content;animation:mq 24s linear infinite;gap:26px;font-size:12px}
@keyframes mq{from{transform:translateX(-50%)}to{transform:none}}
#balbox{display:flex;justify-content:space-between;align-items:center}
.bal{font-size:30px;line-height:1}.bal small{font-size:14px;color:#0a9f6a}
#stage{flex:1;overflow-y:auto;padding:6px 12px 14px}
/* tabs */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:2.5px solid var(--ink)}
#tabs button{font:800 11px Manrope;border:2.5px solid transparent;border-radius:14px;padding:6px 0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#tabs button span{font-size:20px}#tabs .on{background:var(--b);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
/* mining */
#gc{position:relative;margin:6px auto 0;width:230px;padding:14px;border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);cursor:pointer;
 background:color-mix(in srgb,var(--p) calc(var(--heat)*100%),#7be9ff);transition:transform .06s,box-shadow .06s}
#gc:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.fan{background:#fff;border:3px solid var(--ink);border-radius:50%;width:92px;height:92px;margin:10px auto;display:grid;place-items:center}
.fan svg{width:72px;animation:sp 1.8s linear infinite}.fast svg{animation-duration:.25s}
@keyframes sp{to{transform:rotate(360deg)}}
#gname{text-align:center;font-size:12px;margin-top:4px}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;background:var(--m);transition:width .15s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats b{display:block;font:900 13px Unbounded}
.hot #gc{animation:shk .12s infinite}@keyframes shk{50%{transform:translate(3px,-2px) rotate(1deg)}}
#lock{position:absolute;inset:0;border-radius:25px;background:rgba(255,93,143,.93);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;color:#fff;font-family:Unbounded;font-weight:900}
.hot #lock{display:flex}
.fl{position:fixed;z-index:90;pointer-events:none;font:900 16px Unbounded;color:var(--ink);background:var(--y);border:2px solid var(--ink);border-radius:99px;padding:2px 9px;animation:fl .9s ease-out forwards}
@keyframes fl{to{transform:translate(70px,-90px) rotate(12deg);opacity:0}}
/* lists */
.item{display:flex;justify-content:space-between;align-items:center;gap:8px}.item.on{background:#d9fbe9}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{text-align:center;padding:14px 4px;cursor:pointer}.tile span{font-size:26px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg .on{background:var(--b);color:#fff}
/* sheet */
#sh{position:absolute;inset:0;background:rgba(21,18,43,.55);display:none;align-items:flex-end;z-index:60}
#sh.open{display:flex}#sh>div{width:100%;max-height:82%;overflow-y:auto;background:var(--bg);border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:16px;animation:up .25s}
@keyframes up{from{transform:translateY(50px);opacity:0}}
#toast{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:80;display:none}
.tg{position:relative;width:52px;height:30px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;flex:none}.tg:after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--ink);transition:.2s}
.tg.on{background:var(--m)}.tg.on:after{left:24px}
/* games */
.big{font:900 40px Unbounded}.fighters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:210px;margin:auto}.mine button{aspect-ratio:1;font-size:26px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink)}
canvas{width:100%;height:170px;display:block}
.wheel{width:170px;height:170px;border-radius:50%;border:3px solid var(--ink);margin:6px auto;position:relative;transition:transform 1.8s cubic-bezier(.1,.7,.1,1)}
.pin{position:absolute;left:50%;top:-14px;margin-left:-9px;width:0;height:0;border:9px solid transparent;border-top:16px solid var(--ink)}
.coin{width:110px;height:110px;margin:8px auto;border:3px solid var(--ink);border-radius:50%;background:var(--y);display:grid;place-items:center;font:900 34px Unbounded;transition:transform 1.2s}

.cf{position:absolute;top:58%;width:9px;height:14px;border:1.5px solid var(--ink);z-index:95;pointer-events:none;animation:cf 1.1s ease-out forwards}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.bn{position:absolute;left:50%;top:36%;z-index:96;pointer-events:none;font:900 24px Unbounded;padding:10px 18px;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);white-space:nowrap;animation:bn 1.5s forwards}.gd{background:var(--m)}.bd{background:var(--p);color:#fff}
@keyframes bn{0%{transform:translate(-50%,20px) scale(.3);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}25%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
.shk{animation:shk2 .4s}@keyframes shk2{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .7s}@keyframes pop{40%{transform:scale(1.6) rotate(-10deg)}}
.sky{background:linear-gradient(#1b1745,#4a2f8f);position:relative;padding:0;overflow:hidden}.sky .big{position:absolute;left:0;right:0;top:50px;text-align:center;color:#fff;text-shadow:0 3px 0 var(--ink)}
.sky2{position:relative;height:170px;overflow:hidden;background:linear-gradient(#7be9ff,#e8f9ff)}.clouds{position:absolute;inset:0;background:radial-gradient(40px 18px at 20% 30%,#fff 60%,transparent),radial-gradient(50px 20px at 60% 60%,#fff 60%,transparent),radial-gradient(35px 15px at 85% 25%,#fff 60%,transparent);background-size:200px 100%;animation:cl 3s linear infinite}@keyframes cl{to{background-position:-200px 0}}
.glow{animation:gl .5s infinite alternate}@keyframes gl{to{box-shadow:0 0 26px 6px var(--y)}}
.gcard{animation:gin .4s both}@keyframes gin{from{transform:translateX(-30px);opacity:0}}
.bob{display:inline-block;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(8deg)}}
.arena{background:repeating-linear-gradient(45deg,#fff,#fff 10px,#f3f0ff 10px,#f3f0ff 20px)}
.fg{transition:.3s}.clash{animation:cls .3s infinite alternate}@keyframes cls{from{transform:translateX(-12px) rotate(-6deg)}to{transform:translateX(12px) rotate(6deg)}}
.lose{opacity:.35;transform:scale(.9)}.jump{animation:jmp .6s 2}@keyframes jmp{50%{transform:translateY(-16px) scale(1.12)}}
.flip{animation:flp .35s}@keyframes flp{50%{transform:rotateY(90deg) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.cf,.bob,.clouds{animation:none}}

#top,#stage,#tabs{position:relative;z-index:1}
.bgc{position:absolute;z-index:0;pointer-events:none;font-size:26px;opacity:.14;animation:fy linear infinite}@keyframes fy{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-12vh) rotate(360deg)}}
#app{background-color:var(--bg);animation:bgs 14s ease-in-out infinite alternate}@keyframes bgs{to{background-color:#dcf5ff}}
#gc{overflow:hidden;animation:flo 3.6s ease-in-out infinite}@keyframes flo{50%{translate:0 -7px}}
#gc::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);transform:translateX(-130%);animation:shine 4.5s infinite}@keyframes shine{55%,100%{transform:translateX(130%)}}
#stage>*:not(#gc),#stage .col>*{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}#stage .col>*:nth-child(2){animation-delay:.06s}#stage .col>*:nth-child(3){animation-delay:.12s}#stage .col>*:nth-child(4){animation-delay:.18s}#stage .col>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}}
.bal{background:linear-gradient(90deg,#15122b,#4d7cff,#15122b);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bgm 5s linear infinite}@keyframes bgm{to{background-position:200% 0}}
.bump{animation:bmp .5s}@keyframes bmp{40%{transform:scale(1.25) rotate(-4deg);background:var(--y)}}
.btn{transition:transform .1s,box-shadow .1s,filter .2s}.btn:not(:disabled):hover{filter:brightness(1.06)}
#tabs .on span{animation:tb .5s}@keyframes tb{40%{transform:translateY(-6px) scale(1.25)}}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.seg4 .on{background:var(--b);color:#fff}.seg4 .btn{padding:8px 2px;font-size:10px}
.gi{font-size:28px;display:inline-block}.gift{display:inline-block;animation:gft 1.2s infinite}.opened{animation:opn .8s forwards}
@keyframes gft{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.1)}40%{transform:rotate(12deg) scale(1.1)}60%{transform:rotate(-6deg)}}
@keyframes opn{to{transform:scale(1.8) translateY(-20px);opacity:0}}
.chip.boost{background:var(--y);animation:bmp 1s infinite}
.item.on{background:linear-gradient(120deg,#d9fbe9,#fff)}
#tick>div b{color:#4d3bd6}
</style></head><body>
<div id="app"><div id="toast"></div>
<div id="top"><div id="tick"><div id="tickin"></div></div>
<div id="balbox"><div><div class="muted">Баланс</div><div class="bal disp"><span data-bal>0.00</span> <small>$</small></div></div><div class="col" style="align-items:flex-end;gap:5px"><div class="chip disp" style="font-size:13px;background:#c5f7e0">💎 <span data-dia>0.00</span></div><div class="row"><span class="chip" id="onl">🟢 …</span><span class="chip" id="tchip">🌡 36°C</span></div></div></div></div>
<div id="stage"></div>
<nav id="tabs"></nav>
<div id="sh"><div></div></div></div>
<script>
/* ===== STORE + ONLINE ===== */
const GPU=[{n:'GTX 1660 Miner',r:.30,h:'12.5 MH/s',p:'85 W',e:'0.147 M/W',c:0},{n:'RTX 3070 Ti LHR',r:.75,h:'31.2 MH/s',p:'140 W',e:'0.222 M/W',c:50},{n:'RTX 4080 Gaming',r:1.80,h:'78.4 MH/s',p:'220 W',e:'0.356 M/W',c:200},{n:'RTX 4090 OC Ultra',r:4.50,h:'185.0 MH/s',p:'380 W',e:'0.486 M/W',c:650}];
const COINS=['₿','Ξ','◎','₮','💎'],rnd=Math.random;
let TOPS=[],FEED=[],pend=0;
const S={bal:0,dia:0,earned:0,clicks:0,temp:36,hot:false,gpu:0,own:[1,0,0,0],snd:1,vib:1,user:'CryptoMiner',ac:0,fan:0,acOn:0,dailyAt:0,boostAt:0};
const apply=u=>{Object.assign(S,u);S.dailyAt=Date.now()+(u.dl||0)*1000;S.boostAt=Date.now()+(u.bl||0)*1000};
const $=s=>document.querySelector(s),f2=n=>n.toFixed(2);
const save=()=>{};
let lastD=-1;const sync=()=>{document.querySelectorAll('[data-bal]').forEach(e=>e.textContent=f2(S.bal));document.querySelectorAll('[data-dia]').forEach(e=>{e.textContent=f2(S.dia);if(lastD>=0&&S.dia!=lastD&&e.closest('.chip')){const c=e.closest('.chip');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}});lastD=S.dia};
/* ===== НАСТРОЙКА: вставьте данные из Supabase (Project Settings → API) ===== */
const SB_URL='https://qmcvgtkfvsxthukbpafy.supabase.co',SB_KEY='sb_publishable_dmFpfh7OvvYv_LgiP0gSvQ_n124nmga';
const creds=()=>{try{const w=Telegram.WebApp;if(w.initData){const p=new URLSearchParams(w.initData),h=p.get('hash');p.delete('hash');return{d:[...p.entries()].map(([k,v])=>k+'='+v).sort().join('\n'),h}}}catch(e){}
 let g=localStorage.getItem('gid');if(!g){g='g'+rnd().toString(36).slice(2,9);localStorage.setItem('gid',g)}return{d:'user='+JSON.stringify({id:g,first_name:'Гость '+g.slice(-3)}),h:''}};
const post=async(p,b={},hold)=>{try{const c=creds(),r=await fetch(SB_URL+'/rest/v1/rpc/api',{method:'POST',headers:SB_KEY.startsWith('sb_')?{'content-type':'application/json',apikey:SB_KEY}:{'content-type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({d:c.d,h:c.h,f:p,a:b})});const j=await r.json();if(j.err){toast('Ошибка',j.err=='auth'?'Откройте игру через Telegram-бота':j.err);return null}if(!r.ok)throw 0;if(j.u&&!hold){apply(j.u);sync()}return j}catch(e){toast('Нет связи','Сервер недоступен');return null}};
const flush=async()=>{const n=pend;if(!n)return;pend=0;await post('mine',{n})};
setInterval(flush,1500);
const tickUI=()=>{const a=[...TOPS.map((t,i)=>`🏆 #${i+1} <b>${t[0]}</b> ${t[1]} $`),...FEED.map(f=>`🔥 <b>${f.name}</b> +${f2(f.amt)} 💎`)];$('#tickin').innerHTML=[...a,...a].map(x=>`<span>${x}</span>`).join('')};
async function loadTops(){const j=await post('tops',{},1);if(!j)return;TOPS=j.earned.map(x=>[x.name,x.earned.toFixed(0)]);FEED=j.feed;$('#onl').textContent='🟢 '+j.online;tickUI()}
setInterval(loadTops,20000);
async function boot(){const j=await post('state');if(!j){$('#stage').innerHTML='<div class="card col"><b class="disp">Нет связи с сервером</b><p class="muted">Проверьте SB_URL и SB_KEY в начале скрипта и что schema.sql выполнен в Supabase</p><button class="btn" onclick="boot()">Повторить</button></div>';return}S.user=j.name;sync();loadTops();go(0)}
/* ===== FX ===== */
let ac;const tone=(f,t='sine',d=.08,v=.08)=>{if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
const hap=(s='light')=>{if(!S.vib)return;try{Telegram.WebApp.HapticFeedback.impactOccurred(s)}catch(e){navigator.vibrate&&navigator.vibrate(s=='heavy'?60:15)}};
let tt;const toast=(t,m)=>{const e=$('#toast');e.innerHTML=`<div class="card"><b class="disp" style="font-size:12px">${t}</b><div class="muted">${m}</div></div>`;e.style.display='block';hap();clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2600)};
const sheet=(h)=>{$('#sh>div').innerHTML=h;$('#sh').classList.add('open')},shut=()=>$('#sh').classList.remove('open');
$('#sh').onclick=e=>{if(e.target.id=='sh')shut()};
/* ===== MINING ===== */
const heatUI=()=>{const t=S.temp,h=Math.max(0,(t-36)/64);document.documentElement.style.setProperty('--heat',h.toFixed(2));$('#tchip').textContent='🌡 '+t.toFixed(0)+'°C';
 const v=$('#tv');if(!v)return;v.textContent=t.toFixed(1)+'°C';const b=$('#tb');b.style.width=t+'%';b.style.background=t<55?'var(--m)':t<80?'var(--y)':'var(--p)';
 $('#gs').textContent=S.hot?'ПЕРЕГРЕВ':t<55?'Готова':t<80?'Тепло':'Горячо!';
 if(S.hot)$('#cd').style.width=Math.max(0,(t-60)/40*100)+'%'};
const gpuStats=()=>{const g=GPU[S.gpu];$('#gname').textContent=g.n;$('#st').innerHTML=[['Хешрейт',g.h],['Потребление',g.p],['Эффективность',g.e],['Доход / клик','+'+f2(g.r)+' $']].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><b>${b}</b></div>`).join('')};
function tabMine(){$('#stage').innerHTML=`<div id="gc"><div class="row sp"><span class="chip">PCIe 4.0 x16</span><span class="chip" id="gs">Готова</span></div>
<div class="fan" id="f1">${fan()}</div><div class="fan" id="f2">${fan()}</div><div id="lock"><div style="font-size:36px">🔥</div>ПЕРЕГРЕВ!<div style="font:700 11px Manrope">Остывание до 60°C</div><div class="bar" style="width:110px"><i id="cd" style="background:#fff;width:100%"></i></div></div></div>
<div id="gname" class="disp"></div><div class="row" id="ctl" style="justify-content:center;margin-top:8px;flex-wrap:wrap"></div>
<div class="card" style="margin:12px 0"><div class="row sp" style="margin-bottom:6px"><span>Температура</span><b class="disp" id="tv">36°C</b></div><div class="bar"><i id="tb"></i></div></div>
<div class="stats" id="st"></div><p class="muted" style="text-align:center" id="hint">Жми на видеокарту — это майнинг. Не доводи до 100°C!</p>`;
 gpuStats();heatUI();ctlUI();$('#gc').onpointerdown=mineTap}
const fan=()=>`<svg viewBox="0 0 100 100"><g fill="#15122b"><path d="M50 50 48 8C30 10 34 40 50 50Z"/><path d="M50 50 92 48C90 30 60 34 50 50Z"/><path d="M50 50 52 92C70 90 66 60 50 50Z"/><path d="M50 50 8 52C10 70 40 66 50 50Z"/></g><circle cx="50" cy="50" r="9" fill="#ffd23f" stroke="#15122b" stroke-width="4"/></svg>`;
const ACPS=[0,2,4,7],FC=()=>[1,1.4,1.9,2.6][S.fan]||1,FH=()=>[1,.9,.8,.7][S.fan]||1,BL=()=>Math.max(0,(S.boostAt-Date.now())/1000),DL=()=>Math.max(0,(S.dailyAt-Date.now())/1000);
const fmt=t=>{t=Math.ceil(t);const h=t/3600|0,m=t%3600/60|0;return h?h+'ч '+m+'м':m+':'+String(t%60).padStart(2,'0')};
const HINT='Жми на видеокарту — это майнинг. Не доводи до 100°C!';
function mineTap(e){if(S.hot){tone(120,'square',.1,.15);hap('heavy');return}mineCore(e.clientX,e.clientY)}
function mineCore(x,y,auto){
 S.temp=Math.min(100,S.temp+1.6*FH());S.clicks++;const r=GPU[S.gpu].r*(BL()>0?2:1);S.bal+=r;S.earned+=r;pend++;sync();
 if($('#f1')){['#f1','#f2'].forEach(q=>$(q).classList.add('fast'));clearTimeout(window.ft);window.ft=setTimeout(()=>['#f1','#f2'].forEach(q=>$(q).classList.remove('fast')),500);
  const c=document.createElement('div');c.className='fl';c.textContent=COINS[rnd()*5|0]+' +'+f2(r);c.style.left=(x-30+rnd()*30)+'px';c.style.top=(y-30)+'px';document.body.append(c);setTimeout(()=>c.remove(),900)}
 if(!auto){tone(450+rnd()*200,'triangle',.06);hap()}

 $('#pb').onclick=async()=>{if(busy)return;busy=1;const j=await play1({g:'plane'});if(!j){busy=0;return}const p=$('#pl');p.style.transform='translate(190px,-70px) rotate(-18deg)';$('.clouds').style.animationDuration='.5s';tone(300,'sawtooth',.5);await wait(1900);busy=0;up(j);$('.clouds').style.animationDuration='';
  if(j.win)$('#po').textContent=`Успех: x${j.m}`;else{p.textContent='💥';p.style.transform='translate(190px,60px) rotate(60deg)';$('#po').textContent='Самолёт разбился'}
  res(j.win,j.win?'+'+f2(j.prize)+' 💎':'Крушение!');await wait(900);p.style.transition='none';p.style.transform='none';p.textContent='🛩️';await wait(50);p.style.transition='all 1.9s ease-in'};return()=>{}}},
coinflip:{t:'Монетка',i:'🪙',d:'Орёл или решка · x1.95',run(el){let side='heads',busy=0,rot=0;
 const draw=()=>{el.innerHTML=`<div class="card"><div class="coin" id="cn" style="transform:rotateY(${rot}deg)">₿</div><p class="disp" style="font-size:12px;text-align:center" id="fo">Шанс 50%</p></div><div class="seg" style="margin:10px 0">${[['heads','₿ BTC'],['tails','Ξ ETH']].map(([k,t])=>`<button class="btn w ${side==k?'on':''}" onclick="CS('${k}')">${t}</button>`).join('')}</div>${betUI()}<button class="btn g wide" id="fb">Бросить</button>`;$('#fb').onclick=go};
 window.CS=k=>{if(!busy){side=k;draw()}};
 const go=async()=>{if(busy)return;busy=1;const j=await play1({g:'coin',s:side});if(!j){busy=0;return}rot+=1800+(j.s=='tails'?180:0)-(rot%360);$('#cn').style.transform=`rotateY(${rot}deg)`;$('#cn').classList.add('glow');tone(500,'triangle',.3);await wait(1300);busy=0;up(j);$('#cn').classList.remove('glow');$('#cn').textContent=j.s=='heads'?'₿':'Ξ';res(j.win,j.win?'+'+f2(j.prize)+' 💎':'Не повезло')};
 draw();return()=>{delete window.CS}}}};
function tabGames(){stopG&&stopG();stopG=null;$('#stage').innerHTML=`<div class="card item" style="margin-bottom:10px"><span>Играем на 💎 · <b data-dia></b></span><button class="btn g sm" onclick="openExch()">Обмен</button></div><div class="col">${Object.entries(G).map(([k,g],n)=>`<div class="card item gcard" onclick="play('${k}')" style="cursor:pointer;animation-delay:${n*70}ms"><div class="row"><span style="font-size:32px" class="bob">${g.i}</span><div><b class="disp" style="font-size:14px">${g.t}</b><div class="muted">${g.d}</div></div></div><span class="btn sm">Играть</span></div>`).join('')}</div>`;sync()}
function play(k){if(S.dia<.1){toast('Нужны 💎','Игры идут только на алмазы — обменяй доллары');openExch();return}const g=G[k];$('#stage').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn w sm" onclick="tabGames()">←</button><b class="disp">${g.i} ${g.t}</b></div><div id="gm" class="col"></div>`;stopG=g.run($('#gm'));hap('medium')}
/* ===== ROUTER ===== */
const TABS=[['⛏️','Майнинг',tabMine],['🎮','Игры',tabGames],['🛒','Гараж',tabGarage],['☰','Ещё',tabMore]];
function go(i){stopG&&stopG();stopG=null;[...$('#tabs').children].forEach((b,j)=>b.classList.toggle('on',i==j));TABS[i][2]();$('#stage').scrollTop=0;tone(480,'sine',.05,.06);hap()}
$('#tabs').innerHTML=TABS.map((t,i)=>`<button onclick="go(${i})"><span>${t[0]}</span>${t[1]}</button>`).join('');
try{const w=Telegram.WebApp;w.ready();w.expand();w.setHeaderColor('#e8e4ff');w.setBackgroundColor('#e8e4ff');const u=w.initDataUnsafe&&w.initDataUnsafe.user;if(u)S.user=u.username||u.first_name||S.user}catch(e){}
for(let i=0;i<9;i++){const e=document.createElement('i');e.className='bgc';e.textContent=['₿','Ξ','💎','◎','🪙'][i%5];e.style.cssText=`left:${rnd()*92}%;animation-duration:${14+rnd()*14}s;animation-delay:-${rnd()*20}s;font-style:normal`;$('#app').prepend(e)}
setInterval(()=>{ctlUI();bonusUI()},1000);
boot();
</script></body></html>
