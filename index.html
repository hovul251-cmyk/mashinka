<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8e4ff"><title>Crypto Miner Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#e8e4ff;--ink:#15122b;--y:#ffd23f;--p:#ff5d8f;--m:#2ee59d;--b:#4d7cff;--heat:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
body{margin:0;background:#cdc7f4;font:700 14px Manrope,sans-serif;color:var(--ink);display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;background:var(--bg) radial-gradient(rgba(21,18,43,.13) 1.3px,transparent 1.5px) 0 0/22px 22px;overflow:hidden}
.disp{font-family:Unbounded,sans-serif;font-weight:900}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:12px;position:relative}
.btn{font:800 13px Unbounded,sans-serif;border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--y);box-shadow:0 3px 0 var(--ink);color:var(--ink);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:none}.btn:disabled{opacity:.4;cursor:not-allowed}
.g{background:var(--m)}.r{background:var(--p);color:#fff}.w{background:#fff}.b{background:var(--b);color:#fff}.sm{padding:7px 10px;font-size:11px}.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.sp{justify-content:space-between}
input,select{font:800 14px Unbounded,sans-serif;border:2.5px solid var(--ink);border-radius:12px;padding:9px;width:100%;min-width:0;background:#fff;color:var(--ink)}
.chip{border:2px solid var(--ink);border-radius:99px;padding:3px 9px;font-size:11px;background:#fff;white-space:nowrap}
.muted{opacity:.65;font-size:12px}

/* HUD & EXP */
#top{padding:calc(10px + env(safe-area-inset-top)) 12px 6px;display:flex;flex-direction:column;gap:6px}
#tick{overflow:hidden;border:2.5px solid var(--ink);border-radius:99px;background:var(--y);padding:4px 0}
#tick>div{display:flex;width:max-content;animation:mq 24s linear infinite;gap:26px;font-size:12px}
@keyframes mq{from{transform:translateX(-50%)}to{transform:none}}
#balbox{display:flex;justify-content:space-between;align-items:center}
.bal{font-size:28px;line-height:1}
.bal small{font-size:14px;color:#0a9f6a}
.lvl-box{display:flex;align-items:center;gap:6px;width:100%}
.lvl-badge{background:var(--ink);color:var(--y);padding:2px 8px;border-radius:99px;font-size:10px}
.xp-bar{flex:1;height:10px;background:#fff;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.xp-bar>div{height:100%;background:linear-gradient(90deg,var(--m),#00e1ff);width:0%;transition:width .3s}

#stage{flex:1;overflow-y:auto;padding:6px 12px 14px}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:2.5px solid var(--ink)}
#tabs button{font:800 11px Manrope;border:2.5px solid transparent;border-radius:14px;padding:6px 0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#tabs button span{font-size:20px}#tabs .on{background:var(--b);color:#fff;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}

/* GPU MINER */
#gc{position:relative;margin:6px auto 0;width:240px;padding:14px;border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);cursor:pointer;
 background:color-mix(in srgb,var(--p) calc(var(--heat)*100%),#7be9ff);transition:transform .06s,box-shadow .06s;overflow:hidden}
#gc:active{transform:translateY(6px) scale(0.98);box-shadow:0 2px 0 var(--ink)}
.gpu-art{width:100%;height:120px;display:flex;justify-content:center;align-items:center;margin-bottom:6px}
.gpu-art svg{width:100%;height:100%;filter:drop-shadow(0 4px 0 rgba(21,18,43,.35))}
.fan-spin{transform-origin:center;animation:sp 1.8s linear infinite}
.fast .fan-spin{animation-duration:.22s}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--m);transition:width .15s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats b{display:block;font:900 12px Unbounded}
.hot #gc{animation:shk .12s infinite}@keyframes shk{50%{transform:translate(3px,-2px) rotate(1deg)}}
#lock{position:absolute;inset:0;border-radius:25px;background:rgba(255,93,143,.95);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;color:#fff;font-family:Unbounded;font-weight:900}
.hot #lock{display:flex}
.fl{position:fixed;z-index:90;pointer-events:none;font:900 16px Unbounded;color:var(--ink);background:var(--y);border:2.5px solid var(--ink);border-radius:99px;padding:3px 10px;animation:fl .85s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fl{to{transform:translate(60px,-110px) rotate(14deg) scale(1.1);opacity:0}}

/* LISTS & SHEETS */
.item{display:flex;justify-content:space-between;align-items:center;gap:8px}.item.on{background:#d9fbe9}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{text-align:center;padding:14px 4px;cursor:pointer}
.tile span{font-size:26px;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg .on{background:var(--b);color:#fff}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.seg4 .on{background:var(--b);color:#fff}.seg4 .btn{padding:8px 2px;font-size:10px}
#sh{position:absolute;inset:0;background:rgba(21,18,43,.55);display:none;align-items:flex-end;z-index:99}
#sh.open{display:flex}
#sh>div{width:100%;max-height:86%;overflow-y:auto;background:var(--bg);border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#toast{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:110;display:none}
.tg{position:relative;width:52px;height:30px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;flex:none;cursor:pointer}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--ink);transition:.2s}
.tg.on{background:var(--m)}.tg.on:after{left:24px}

/* GAMES FX */
.big{font:900 38px Unbounded}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:230px;margin:auto}
.mine button{aspect-ratio:1;font-size:28px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);transition:transform .2s,background .2s}
.mine button:active{transform:scale(0.92)}
.wheel{width:180px;height:180px;border-radius:50%;border:4px solid var(--ink);margin:6px auto;position:relative;transition:transform 2.4s cubic-bezier(.12,.8,.1,1);box-shadow:0 6px 0 rgba(21,18,43,.2)}
.pin{position:absolute;left:50%;top:-16px;margin-left:-11px;width:0;height:0;border:11px solid transparent;border-top:19px solid var(--ink);z-index:5}
.coin{width:120px;height:120px;margin:12px auto;border:3px solid var(--ink);border-radius:50%;background:linear-gradient(135deg,var(--y),#ff9f1c);display:grid;place-items:center;font:900 38px Unbounded;box-shadow:0 6px 0 var(--ink);transition:transform 1.4s cubic-bezier(.3,1.4,.5,1)}
.cf{position:absolute;top:50%;width:10px;height:14px;border:1.5px solid var(--ink);z-index:95;pointer-events:none;animation:cf 1.2s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.bn{position:absolute;left:50%;top:36%;z-index:96;pointer-events:none;font:900 22px Unbounded;padding:10px 18px;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);white-space:nowrap;animation:bn 1.5s forwards}
.gd{background:var(--m)}.bd{background:var(--p);color:#fff}
@keyframes bn{0%{transform:translate(-50%,20px) scale(.4);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
.clash{animation:cls .22s infinite alternate}@keyframes cls{from{transform:translateX(-10px) rotate(-8deg) scale(1.05)}to{transform:translateX(10px) rotate(8deg) scale(1.05)}}
.jump{animation:jmp .5s 2 ease-out}@keyframes jmp{50%{transform:translateY(-22px) scale(1.15)}}
.flip{animation:flp .4s ease-out}@keyframes flp{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.2)}100%{transform:rotateY(0)}}
.plane-box{position:relative;height:180px;background:linear-gradient(180deg,#5bc9eb 0%,#b2ecfa 100%);border-radius:16px;border:2.5px solid var(--ink);overflow:hidden}
.sky-trail{position:absolute;height:3px;background:rgba(255,255,255,.8);border-radius:2px}
</style></head><body>
<div id="app">
<div id="toast"></div>
<div id="top">
  <div id="tick"><div id="tickin"></div></div>
  <div id="balbox">
    <div>
      <div class="muted">Баланс</div>
      <div class="bal disp"><span data-bal>0.00</span> <small>$</small></div>
    </div>
    <div class="col" style="align-items:flex-end;gap:4px">
      <div class="chip disp" style="font-size:13px;background:#c5f7e0">💎 <span data-dia>0.00</span></div>
      <div class="row"><span class="chip" id="onl">🟢 Онлайн: 142</span><span class="chip" id="tchip">🌡 36°C</span></div>
    </div>
  </div>
  <div class="lvl-box">
    <span class="disp lvl-badge" id="lvlBadge">LVL 1</span>
    <div class="xp-bar"><div id="xpFill"></div></div>
    <span class="muted" id="xpText" style="font-size:11px">0/100 XP</span>
  </div>
</div>

<div id="stage"></div>
<nav id="tabs"></nav>
<div id="sh"><div></div></div>
</div>

<script>
/* ===== 2D SVG АРТЫ ДЛЯ ВИДЕОКАРТ ===== */
const GPU_ART=[
  // GTX 1660
  `<svg viewBox="0 0 200 110"><rect x="15" y="15" width="170" height="80" rx="14" fill="#292d3e" stroke="#15122b" stroke-width="4"/>
  <rect x="25" y="25" width="65" height="60" rx="30" fill="#383d57" stroke="#15122b" stroke-width="3"/>
  <rect x="105" y="25" width="65" height="60" rx="30" fill="#383d57" stroke="#15122b" stroke-width="3"/>
  <g class="fan-spin" style="transform-origin: 57px 55px"><circle cx="57" cy="55" r="24" fill="none" stroke="#2ee59d" stroke-dasharray="8 6" stroke-width="4"/><circle cx="57" cy="55" r="8" fill="#ffd23f" stroke="#15122b" stroke-width="2"/></g>
  <g class="fan-spin" style="transform-origin: 137px 55px"><circle cx="137" cy="55" r="24" fill="none" stroke="#2ee59d" stroke-dasharray="8 6" stroke-width="4"/><circle cx="137" cy="55" r="8" fill="#ffd23f" stroke="#15122b" stroke-width="2"/></g>
  <rect x="4" y="32" width="12" height="46" rx="3" fill="#8892b0" stroke="#15122b" stroke-width="3"/></svg>`,
  // RTX 3070 Ti
  `<svg viewBox="0 0 200 110"><rect x="15" y="15" width="170" height="80" rx="14" fill="#1b1c27" stroke="#15122b" stroke-width="4"/>
  <path d="M 25 22 L 175 22 L 165 88 L 35 88 Z" fill="#282a3d"/>
  <line x1="45" y1="24" x2="45" y2="86" stroke="#4d7cff" stroke-width="3"/><line x1="55" y1="24" x2="55" y2="86" stroke="#4d7cff" stroke-width="3"/>
  <g class="fan-spin" style="transform-origin: 120px 55px"><circle cx="120" cy="55" r="28" fill="#15122b"/><circle cx="120" cy="55" r="24" fill="none" stroke="#4d7cff" stroke-width="4" stroke-dasharray="10 5"/><circle cx="120" cy="55" r="9" fill="#ff5d8f" stroke="#fff" stroke-width="2"/></g>
  <text x="32" y="58" fill="#ffd23f" font-family="Unbounded" font-size="11" font-weight="900">RTX</text>
  <rect x="4" y="28" width="12" height="54" rx="3" fill="#cfd6e6" stroke="#15122b" stroke-width="3"/></svg>`,
  // RTX 4080
  `<svg viewBox="0 0 200 110"><rect x="15" y="12" width="170" height="86" rx="16" fill="#11131a" stroke="#15122b" stroke-width="4"/>
  <rect x="22" y="20" width="70" height="70" rx="35" fill="#1c2030" stroke="#2ee59d" stroke-width="2.5"/>
  <rect x="106" y="20" width="70" height="70" rx="35" fill="#1c2030" stroke="#ff5d8f" stroke-width="2.5"/>
  <g class="fan-spin" style="transform-origin: 57px 55px"><circle cx="57" cy="55" r="26" fill="none" stroke="#2ee59d" stroke-width="5" stroke-dasharray="7 5"/><circle cx="57" cy="55" r="9" fill="#2ee59d"/></g>
  <g class="fan-spin" style="transform-origin: 141px 55px"><circle cx="141" cy="55" r="26" fill="none" stroke="#ff5d8f" stroke-width="5" stroke-dasharray="7 5"/><circle cx="141" cy="55" r="9" fill="#ff5d8f"/></g>
  <rect x="88" y="22" width="22" height="66" rx="4" fill="#ffd23f" stroke="#15122b" stroke-width="2"/></svg>`,
  // RTX 4090 OC
  `<svg viewBox="0 0 200 110"><rect x="12" y="10" width="176" height="90" rx="18" fill="#0d0e17" stroke="#15122b" stroke-width="4"/>
  <path d="M 16 14 L 184 96 M 184 14 L 16 96" stroke="#4d7cff" stroke-width="3" opacity="0.4"/>
  <circle cx="50" cy="55" r="27" fill="#1b1c2b" stroke="#ffd23f" stroke-width="3"/>
  <circle cx="100" cy="55" r="27" fill="#1b1c2b" stroke="#2ee59d" stroke-width="3"/>
  <circle cx="150" cy="55" r="27" fill="#1b1c2b" stroke="#ff5d8f" stroke-width="3"/>
  <g class="fan-spin" style="transform-origin: 50px 55px"><circle cx="50" cy="55" r="20" fill="none" stroke="#ffd23f" stroke-dasharray="8 4" stroke-width="4"/></g>
  <g class="fan-spin" style="transform-origin: 100px 55px"><circle cx="100" cy="55" r="20" fill="none" stroke="#2ee59d" stroke-dasharray="8 4" stroke-width="4"/></g>
  <g class="fan-spin" style="transform-origin: 150px 55px"><circle cx="150" cy="55" r="20" fill="none" stroke="#ff5d8f" stroke-dasharray="8 4" stroke-width="4"/></g></svg>`
];

/* ===== STATE & LEVEL SYSTEM ===== */
const GPU=[
  {n:'GTX 1660 Miner',r:.30,h:'12.5 MH/s',p:'85 W',e:'0.147 M/W',c:0},
  {n:'RTX 3070 Ti LHR',r:.75,h:'31.2 MH/s',p:'140 W',e:'0.222 M/W',c:50},
  {n:'RTX 4080 Gaming',r:1.80,h:'78.4 MH/s',p:'220 W',e:'0.356 M/W',c:200},
  {n:'RTX 4090 OC Ultra',r:4.50,h:'185.0 MH/s',p:'380 W',e:'0.486 M/W',c:650}
];

const S={
  bal: 25.00,
  dia: 5.00,
  earned: 25.00,
  clicks: 0,
  temp: 36,
  hot: false,
  gpu: 0,
  own: [1,0,0,0],
  snd: 1,
  vib: 1,
  user: 'CryptoMiner',
  ac: 0,
  fan: 0,
  acOn: 0,
  dailyAt: 0,
  boostAt: 0,
  // Новые параметры:
  lvl: 1,
  xp: 0,
  refCount: 3,
  clan: null,
  paste: 0,       // термопаста
  power: 0,       // стабилизатор питания
  tasks: {}       // выполненные 1 раз задания
};

// Загрузка сохранённого состояния
try{
  const local=localStorage.getItem('cm_pro_state');
  if(local) Object.assign(S,JSON.parse(local));
}catch(e){}

const save=()=>{
  try{localStorage.setItem('cm_pro_state',JSON.stringify(S))}catch(e){}
};

const rnd=Math.random, f2=n=>(+n).toFixed(2), $=s=>document.querySelector(s);
let TOPS=[['CryptoWhale', '1420'], ['Satoshi_N', '980'], ['MiningKing', '750']], FEED=[];

function addXP(amount){
  S.xp+=amount;
  const need=S.lvl*100;
  if(S.xp>=need){
    S.xp-=need;
    S.lvl++;
    S.dia+=2;
    banner('🎉 НОВЫЙ LVL '+S.lvl+'! (+2 💎)',1);
    tone(950,'triangle',.3,.3);
    confetti(40);
  }
  updateXPUI();
  save();
}

function updateXPUI(){
  const need=S.lvl*100;
  $('#lvlBadge').textContent='LVL '+S.lvl;
  $('#xpFill').style.width=(Math.min(100,(S.xp/need)*100))+'%';
  $('#xpText').textContent=`${S.xp}/${need} XP`;
}

const sync=()=>{
  document.querySelectorAll('[data-bal]').forEach(e=>e.textContent=f2(S.bal));
  document.querySelectorAll('[data-dia]').forEach(e=>e.textContent=f2(S.dia));
  updateXPUI();
};

/* ===== ЗВУК И СИГНАЛЫ ===== */
let acx;
const tone=(f,t='sine',d=.08,v=.08)=>{
  if(!S.snd)return;
  try{
    acx=acx||new(window.AudioContext||window.webkitAudioContext)();
    const o=acx.createOscillator(),g=acx.createGain();
    o.type=t;o.frequency.value=f;g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(.001,acx.currentTime+d);
    o.connect(g).connect(acx.destination);
    o.start();o.stop(acx.currentTime+d);
  }catch(e){}
};
const hap=(s='light')=>{
  if(!S.vib)return;
  try{Telegram.WebApp.HapticFeedback.impactOccurred(s)}catch(e){if(navigator.vibrate)navigator.vibrate(s=='heavy'?60:15)}
};
let tt;
const toast=(t,m)=>{
  const e=$('#toast');
  e.innerHTML=`<div class="card"><b class="disp" style="font-size:12px">${t}</b><div class="muted">${m}</div></div>`;
  e.style.display='block';hap();clearTimeout(tt);
  tt=setTimeout(()=>e.style.display='none',2600);
};
const sheet=h=>{$('#sh>div').innerHTML=h;$('#sh').classList.add('open')};
const shut=()=>$('#sh').classList.remove('open');
$('#sh').onclick=e=>{if(e.target.id=='sh')shut()};

const confetti=(n=40)=>{
  for(let i=0;i<n;i++){
    const e=document.createElement('i');e.className='cf';
    e.style.cssText=`left:${40+rnd()*20}%;background:${['#ffd23f','#ff5d8f','#2ee59d','#4d7cff'][i%4]};--x:${rnd()*340-170}px;--y:${-rnd()*300-60}px;--r:${rnd()*720}deg`;
    $('#app').append(e);setTimeout(()=>e.remove(),1200);
  }
};
const banner=(t,g)=>{
  const e=document.createElement('div');
  e.className='bn '+(g?'gd':'bd');e.textContent=t;
  $('#app').append(e);setTimeout(()=>e.remove(),1500);
};

/* ===== МАЙНИНГ ===== */
const FC=()=>([1,1.4,1.9,2.6][S.fan]||1)*(S.paste?1.35:1);
const FH=()=>([1,.9,.8,.7][S.fan]||1)*(S.paste?0.75:1);
const BL=()=>Math.max(0,(S.boostAt-Date.now())/1000);
const DL=()=>Math.max(0,(S.dailyAt-Date.now())/1000);
const fmt=t=>{t=Math.ceil(t);const h=t/3600|0,m=t%3600/60|0;return h?h+'ч '+m+'м':m+':'+String(t%60).padStart(2,'0')};

function tabMine(){
  $('#stage').innerHTML=`
  <div id="gc">
    <div class="row sp"><span class="chip">PCIe 4.0 x16</span><span class="chip" id="gs">Готова</span></div>
    <div class="gpu-art" id="gpuVisual">${GPU_ART[S.gpu]}</div>
    <div id="lock">
      <div style="font-size:36px">🔥</div>ПЕРЕГРЕВ!
      <div style="font:700 11px Manrope">Остывание до 60°C</div>
      <div class="bar" style="width:110px"><i id="cd" style="background:#fff;width:100%"></i></div>
    </div>
  </div>
  <div id="gname" class="disp" style="text-align:center;font-size:14px;margin-top:6px"></div>
  <div class="row" id="ctl" style="justify-content:center;margin-top:8px;flex-wrap:wrap"></div>
  <div class="card" style="margin:12px 0">
    <div class="row sp" style="margin-bottom:6px"><span>Температура GPU</span><b class="disp" id="tv">36°C</b></div>
    <div class="bar"><i id="tb"></i></div>
  </div>
  <div class="stats" id="st"></div>
  <p class="muted" style="text-align:center;margin-top:8px" id="hint">Кликай по видеокарте для майнинга крипты!</p>`;
  
  gpuStats();heatUI();ctlUI();
  $('#gc').onpointerdown=mineTap;
}

const gpuStats=()=>{
  const g=GPU[S.gpu];
  $('#gname').textContent=g.n;
  $('#st').innerHTML=[
    ['Хешрейт',g.h],
    ['Потребление',g.p],
    ['Бонус клана', S.clan?'+'+S.clan.bonus+'%':'0%'],
    ['Доход / клик','+'+f2(g.r*(BL()>0?2:1)*(1+(S.power*.15)))+' $']
  ].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><b>${b}</b></div>`).join('');
};

const heatUI=()=>{
  const t=S.temp,h=Math.max(0,(t-36)/64);
  document.documentElement.style.setProperty('--heat',h.toFixed(2));
  $('#tchip').textContent='🌡 '+t.toFixed(0)+'°C';
  const v=$('#tv');if(!v)return;
  v.textContent=t.toFixed(1)+'°C';
  const b=$('#tb');b.style.width=t+'%';
  b.style.background=t<55?'var(--m)':t<80?'var(--y)':'var(--p)';
  $('#gs').textContent=S.hot?'ПЕРЕГРЕВ':t<55?'Готова':t<80?'Тепло':'Горячо!';
  if(S.hot)$('#cd').style.width=Math.max(0,(t-60)/40*100)+'%';
};

function mineTap(e){
  if(S.hot){tone(120,'square',.1,.15);hap('heavy');return}
  mineCore(e.clientX,e.clientY);
}

function mineCore(x,y,auto){
  S.temp=Math.min(100,S.temp+1.5*FH());
  S.clicks++;
  const mult=(BL()>0?2:1)*(1+(S.power*.15))*(S.clan?(1+S.clan.bonus/100):1);
  const r=GPU[S.gpu].r*mult;
  S.bal+=r;S.earned+=r;
  addXP(1);
  sync();
  
  const gVis=$('#gpuVisual');
  if(gVis){
    gVis.classList.add('fast');
    clearTimeout(window.gvt);
    window.gvt=setTimeout(()=>gVis.classList.remove('fast'),400);
    const c=document.createElement('div');
    c.className='fl';
    c.textContent=['₿','Ξ','💎','₮'][rnd()*4|0]+' +'+f2(r);
    c.style.left=(x-30+rnd()*30)+'px';
    c.style.top=(y-30)+'px';
    document.body.append(c);
    setTimeout(()=>c.remove(),850);
  }
  
  if(!auto){tone(480+rnd()*180,'triangle',.05);hap()}
  if(S.temp>=100){
    S.hot=true;S.temp=100;
    document.body.classList.add('hot');
    $('#hint')&&($('#hint').textContent='🚨 Кликать нельзя, пока видеокарта не остынет!');
    tone(170,'sawtooth',.4,.2);hap('heavy');
  }
  heatUI();
}

setInterval(function(){
  if(S.temp>36){
    S.temp=Math.max(36,S.temp-(S.hot?.85:.65)*FC());
    if(S.hot&&S.temp<=60){
      S.hot=false;
      document.body.classList.remove('hot');
      $('#hint')&&($('#hint').textContent='Кликай по видеокарте для майнинга крипты!');
      tone(620);
    }
    heatUI();
  }
},200);

const ACPS=[0,2,4,7];
let acAcc=0;
setInterval(()=>{
  if(S.acOn&&S.ac&&!S.hot&&S.temp<95){
    acAcc+=ACPS[S.ac]*.1;
    while(acAcc>=1){
      acAcc--;
      const c=$('#gc'),r=c?c.getBoundingClientRect():null;
      mineCore(r?r.left+r.width/2+(rnd()-.5)*80:-99,r?r.top+r.height/2:-99,1);
    }
  }
},100);

  if(S.bal<cost)return toast('Не хватает $',`Нужно ${cost} $`);
  S.bal-=cost;S.dia+=val;
  confetti(30);banner(`+${val} 💎`,1);
  tone(880);sync();save();openExch();
}

/* ===== МИНИ-ИГРЫ С УЛУЧШЕННЫМИ АНИМАЦИЯМИ ===== */
let bet=1, stopGame=null;
const betUI=()=>`
<div class="card col" style="margin:10px 0">
  <div class="row">
    <span class="disp">💎</span>
    <input id="betVal" type="number" step="0.5" min="0.1" value="${bet}" oninput="bet=Math.max(.1,+this.value||.1)">
    <button class="btn w sm" onclick="setB(bet/2)">½</button>
    <button class="btn w sm" onclick="setB(bet*2)">×2</button>
  </div>
  <div class="row">
    ${[.5,1,2,5].map(v=>`<button class="btn w sm wide" onclick="setB(${v})">${v}</button>`).join('')}
  </div>
</div>`;

const setB=v=>{bet=Math.max(.1,+v.toFixed(1));$('#betVal').value=bet;tone(500)};
const canBet=()=>{
  if(S.dia<bet){toast('Мало 💎','Обменяйте $ в обменнике');openExch();return false}
  return true;
};

const GAMES={
  crash:{
    t:'Краш Ракета',i:'🚀',d:'Забери до взрыва · Динамический график',
    run(el){
      let multi=1.00, crashed=false, running=false, timer, cashable=false;
      el.innerHTML=`
      <div class="card" style="background:#0c0f1d;color:#fff;overflow:hidden;padding:10px">
        <div style="height:140px;position:relative;display:flex;align-items:center;justify-content:center">
          <div class="big disp" id="cmTxt" style="color:var(--m);z-index:2">x1.00</div>
          <div id="rkIcon" style="position:absolute;bottom:15px;left:20px;font-size:36px;transition:all .1s linear">🚀</div>
        </div>
      </div>
      ${betUI()}
      <button class="btn g wide" id="cBtn">Запустить ракету</button>`;
      
      const btn=$('#cBtn'), txt=$('#cmTxt'), rk=$('#rkIcon');
      btn.onclick=()=>{
        if(!running){
          if(!canBet())return;
          S.dia-=bet;sync();
          running=true;cashable=true;crashed=false;multi=1.00;
          btn.className='btn r wide';btn.textContent='Забрать (x1.00)';
          const crashPoint=1+rnd()*rnd()*8; // краш-фактор
          
          timer=setInterval(()=>{
            multi+=0.04+multi*0.012;
            txt.textContent='x'+multi.toFixed(2);
            btn.textContent='Забрать ('+f2(bet*multi)+' 💎)';
            rk.style.transform=`translate(${Math.min(220,multi*35)}px, -${Math.min(90,multi*16)}px) rotate(-18deg)`;
            
            if(multi>=crashPoint){
              clearInterval(timer);
              running=false;cashable=false;
              txt.textContent='💥 КРАШ x'+multi.toFixed(2);
              txt.style.color='var(--p)';
              rk.textContent='💥';
              btn.className='btn g wide';btn.textContent='Запустить снова';
              tone(140,'sawtooth',.4,.3);hap('heavy');
              banner('КРАШ!',0);
            }
          },80);
        }else if(cashable){
          clearInterval(timer);
          running=false;cashable=false;
          const win=bet*multi;
          S.dia+=win;
          addXP(20);
          S.tasks['played_game']=1;
          btn.className='btn g wide';btn.textContent='Запустить снова';
          confetti(35);banner('+'+f2(win)+' 💎',1);
          tone(900,'triangle',.25);
          sync();save();
        }
      };
      return ()=>{clearInterval(timer)};
    }
  },
  
  wheel:{
    t:'Колесо Фортуны',i:'⚡',d:'Выбери сектор риска · до x9.5',
    run(el){
      let ch=50,mu=1.95,rot=0,busy=false;
      const render=()=>{
        el.innerHTML=`
        <div class="card" style="text-align:center">
          <div style="position:relative;width:180px;margin:12px auto">
            <div class="pin"></div>
            <div class="wheel" id="whl" style="background:conic-gradient(var(--m) 0 ${ch*3.6}deg, var(--p) 0);transform:rotate(${rot}deg)"></div>
          </div>
          <div class="disp" id="whlRes" style="margin-top:8px">Шанс: ${ch}% · Множитель: x${mu}</div>
        </div>
        <div class="seg" style="grid-template-columns:repeat(4,1fr);margin:8px 0">
          ${[[80,1.22],[50,1.95],[25,3.85],[10,9.5]].map(([c,m])=>`<button class="btn w sm ${c==ch?'on':''}" onclick="selW(${c},${m})">${c}%<br>x${m}</button>`).join('')}
        </div>
        ${betUI()}
        <button class="btn g wide" id="wSpin">Крутить колесо</button>`;
        $('#wSpin').onclick=spin;
      };
      window.selW=(c,m)=>{if(busy)return;ch=c;mu=m;render()};
      
      const spin=()=>{
        if(busy||!canBet())return;
        busy=true;S.dia-=bet;sync();
        const win=rnd()*100<ch;
        const targetDeg=win ? (rnd()*ch*3.6) : (ch*3.6 + rnd()*(360-ch*3.6));
        rot += 1440 + (360 - (rot % 360)) + (360 - targetDeg);
        const w=$('#whl');
        w.style.transform=`rotate(${rot}deg)`;
        tone(350,'square',.6);
        
        setTimeout(()=>{
          busy=false;
          if(win){
            const prize=bet*mu;
            S.dia+=prize;addXP(15);
            confetti(30);banner('+'+f2(prize)+' 💎',1);
            tone(920);
          }else{
            banner('Мимо!',0);tone(160,'sawtooth',.3);hap('heavy');
          }
          S.tasks['played_game']=1;
          sync();save();
        },2400);
      };
      render();
      return ()=>{delete window.selW};
    }
  },

  pickaxe:{
    t:'Кирка Шахтера',i:'⛏️',d:'Найди алмазы среди 9 тайлов',
    run(el){
      let active=false, bombs=[], found=0, mult=1.0;
      const render=()=>{
        el.innerHTML=`
        <div class="card" style="text-align:center">
          <div class="big disp" id="pmText">x${mult.toFixed(2)}</div>
          <div class="muted">${active?'Открывай ячейки и забирай 💎':'2 динамита на поле'}</div>
        </div>
        <div class="mine" style="margin:12px auto">
          ${[...Array(9)].map((_,i)=>`<button class="btn w" id="m_${i}" onclick="dig(${i})">⬜</button>`).join('')}
        </div>
        ${betUI()}
        <button class="btn g wide" id="pBtn">${active?'Забрать '+f2(bet*mult)+' 💎':'Начать поиск'}</button>`;
        $('#pBtn').onclick=action;
      };
      
      const action=()=>{
        if(!active){
          if(!canBet())return;
          S.dia-=bet;sync();
          active=true;found=0;mult=1.0;
          bombs=[];
          while(bombs.length<2){
            const r=rnd()*9|0;if(!bombs.includes(r))bombs.push(r);
          }
          render();
        }else{
          const prize=bet*mult;
          S.dia+=prize;addXP(25);
          active=false;
          confetti(30);banner('+'+f2(prize)+' 💎',1);
          tone(880);sync();save();render();
        }
      };

      window.dig=(i)=>{
        if(!active)return;
        const b=$('#m_'+i);
        if(b.textContent!=='⬜')return;
        b.classList.add('flip');
        
        if(bombs.includes(i)){
          b.textContent='💣';b.style.background='var(--p)';
          active=false;
          bombs.forEach(k=>{$('#m_'+k).textContent='💣';$('#m_'+k).style.background='var(--p)'});
          banner('БАМ! Динамит',0);
          tone(130,'sawtooth',.4);hap('heavy');
          $('#pBtn').textContent='Начать заново';
        }else{
          b.textContent='💎';b.style.background='var(--m)';
          found++;
          mult+=0.45*found;
          tone(550+found*80);
          $('#pmText').textContent='x'+mult.toFixed(2);
          $('#pBtn').textContent='Забрать '+f2(bet*mult)+' 💎';
        }
      };
      render();
      return ()=>{delete window.dig};
    }
  },

  coinflip:{
    t:'Монетка 3D',i:'🪙',d:'Орёл или решка · Классика x1.95',
    run(el){
      let side='btc',busy=false,deg=0;
      const render=()=>{
        el.innerHTML=`
        <div class="card" style="text-align:center">
          <div class="coin" id="c3d">₿</div>
          <div class="disp" style="margin-top:8px">Выбор: ${side==='btc'?'Bitcoin (Орёл)':'Ethereum (Решка)'}</div>
        </div>
        <div class="seg" style="margin:10px 0">
          <button class="btn w ${side==='btc'?'on':''}" onclick="setSide('btc')">₿ Bitcoin</button>
          <button class="btn w ${side==='eth'?'on':''}" onclick="setSide('eth')">Ξ Ethereum</button>
        </div>
        ${betUI()}
        <button class="btn g wide" id="cFlip">Бросить монетку</button>`;
        $('#cFlip').onclick=flip;
      };
      window.setSide=s=>{if(!busy){side=s;render()}};
      
      const flip=()=>{
        if(busy||!canBet())return;
        busy=true;S.dia-=bet;sync();
        const win=rnd()>0.5;
        const resultSide=win ? side : (side==='btc'?'eth':'btc');
        deg += 1800 + (resultSide==='btc'?0:180) - (deg%360);
        const c=$('#c3d');
        c.style.transform=`rotateY(${deg}deg)`;
        tone(600,'triangle',.25);
        
        setTimeout(()=>{
          c.textContent=resultSide==='btc'?'₿':'Ξ';
          busy=false;
          if(win){
            const p=bet*1.95;
            S.dia+=p;addXP(15);
            confetti(30);banner('+'+f2(p)+' 💎',1);
            tone(920);
          }else{
            banner('Не угадал!',0);tone(160,'sawtooth',.25);hap('heavy');
          }
          sync();save();
        },1400);
      };
      render();
      return ()=>{delete window.setSide};
    }
  }
};

function tabGames(){
  stopGame&&stopGame();stopGame=null;
  $('#stage').innerHTML=`
    <div class="card item" style="margin-bottom:10px">
      <span>Баланс: <b data-dia></b> 💎</span>
      <button class="btn g sm" onclick="openExch()">Обмен $ → 💎</button>
    </div>
    <div class="col">
      ${Object.entries(GAMES).map(([k,g])=>`
        <div class="card item" onclick="launchGame('${k}')" style="cursor:pointer">
          <div class="row">
            <span style="font-size:32px" class="bob">${g.i}</span>
            <div><b class="disp">${g.t}</b><div class="muted">${g.d}</div></div>
          </div>
          <span class="btn sm">Играть</span>
        </div>`).join('')}
    </div>`;
  sync();
}

function launchGame(k){
  const g=GAMES[k];
  $('#stage').innerHTML=`
    <div class="row" style="margin-bottom:10px">
      <button class="btn w sm" onclick="tabGames()">← Назад</button>
      <b class="disp">${g.i} ${g.t}</b>
    </div>
    <div id="gameZone"></div>`;
  stopGame=g.run($('#gameZone'));
}

/* ===== ЕЩЁ (МЕНЮ) ===== */
const MORE=[
  ['⭐️','Stars Донат',openDonate],
  ['📋','Задания (Квесты)',openTasks],
  ['🌐','Кланы / Пул',openClans],
  ['👥','Рефералы',openRefs],
  ['🔄','Обменник',openExch],
  ['⚙️','Настройки',()=>sheet(`
    <h3 class="disp" style="margin-top:0">Настройки</h3>
    <div class="col">
      <div class="card item"><span>Звуковые эффекты</span><div class="tg ${S.snd?'on':''}" onclick="S.snd=+!S.snd;this.classList.toggle('on');save()"></div></div>
      <div class="card item"><span>Виброотклик Haptic</span><div class="tg ${S.vib?'on':''}" onclick="S.vib=+!S.vib;this.classList.toggle('on');save()"></div></div>
    </div>`)]
];

function tabMore(){
  $('#stage').innerHTML=`
    <div class="grid3">
      ${MORE.map((m,i)=>`<div class="card tile" onclick="MORE[${i}][2]()"><span>${m[0]}</span>${m[1]}</div>`).join('')}
    </div>
    <div class="card" style="margin-top:12px">
      <b class="disp" style="font-size:12px">Статистика аккаунта</b>
      <div class="stats" style="margin-top:8px">
        <div class="card"><div class="muted">Кликов сделано</div><b>${S.clicks}</b></div>
        <div class="card"><div class="muted">Уровень фермы</div><b>LVL ${S.lvl}</b></div>
      </div>
    </div>`;
}

/* ===== НАВИГАЦИЯ И СТАРТ ===== */
const TABS=[['⛏️','Майнинг',tabMine],['🎮','Игры',tabGames],['🛒','Гараж',tabGarage],['☰','Ещё',tabMore]];
function go(i){
  stopGame&&stopGame();stopGame=null;
  [...$('#tabs').children].forEach((b,j)=>b.classList.toggle('on',i==j));
  TABS[i][2]();
  $('#stage').scrollTop=0;
  tone(520,'sine',.04);hap();
}

$('#tabs').innerHTML=TABS.map((t,i)=>`<button onclick="go(${i})"><span>${t[0]}</span>${t[1]}</button>`).join('');

// Тикер побед и онлайна
const TICK_ITEMS=['🏆 #1 CyberWhale 1,420 $','🔥 Satoshi_N +5.0 💎 в Краш','🚀 MinerPro апнул LVL 5!','⚡ Новый клан [TON] StarsClub'];
$('#tickin').innerHTML=[...TICK_ITEMS,...TICK_ITEMS].map(x=>`<span>${x}</span>`).join('');

try{
  const w=Telegram.WebApp;
  w.ready();w.expand();
  w.setHeaderColor('#e8e4ff');w.setBackgroundColor('#e8e4ff');
  const u=w.initDataUnsafe&&w.initDataUnsafe.user;
  if(u) S.user=u.username||u.first_name||S.user;
}catch(e){}

sync();
go(0);
</script>
